<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darmtagebuch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<script>window.DT_STANDALONE=true;</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Darmtagebuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte; oben die 24-Stunden-Leiste als Herzstück, große Aktionen am Daumen, schwebende Tab-Leiste */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E9ECF2; --ink:#101522; --muted:#5A6375; --line:#E0E4EC;
  --accent:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#E8E7FC;
  --glass:rgba(255,255,255,.82);
  --b-hard:#3767B0; --b-ok:#23905A; --b-soft:#C08A10; --b-liquid:#C9433A;
  --warn-soft:#FBE4E1; --warn-ink:#A3302A; --good-soft:#DDF3E6; --good-ink:#1C7448;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(16,21,34,.05), 0 8px 24px rgba(16,21,34,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151A22; --sunk:#1F2631; --ink:#E9EDF3; --muted:#9AA4B3; --line:#28303C;
  --accent:#9D9EFB; --accent-ink:#15133A; --accent-soft:#262551;
  --glass:rgba(21,26,34,.82);
  --b-hard:#7FA6E6; --b-ok:#56C188; --b-soft:#E3B24D; --b-liquid:#F17C70;
  --warn-soft:#3D1F1D; --warn-ink:#F4A39A; --good-soft:#163323; --good-ink:#86DBAA;
  --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A22; --sunk:#1F2631; --ink:#E9EDF3; --muted:#9AA4B3; --line:#28303C;
  --accent:#9D9EFB; --accent-ink:#15133A; --accent-soft:#262551;
  --glass:rgba(21,26,34,.82);
  --b-hard:#7FA6E6; --b-ok:#56C188; --b-soft:#E3B24D; --b-liquid:#F17C70;
  --warn-soft:#3D1F1D; --warn-ink:#F4A39A; --good-soft:#163323; --good-ink:#86DBAA;
  --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:2.1rem;line-height:1.02;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.84rem;font-weight:600;color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.note{font-size:.86rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card.flat{background:var(--sunk);box-shadow:none}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.top > div:first-child{min-width:0}
.pillnav{display:flex;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:3px;flex:none}
.pillnav button{width:44px;height:40px;border:0;background:none;border-radius:999px;font-size:1.35rem;line-height:1}
.pillnav button:disabled{opacity:.28;cursor:default}

/* Tagesübersicht */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.strip{position:relative;height:50px;margin:20px 10px 0}
.strip .track{position:absolute;left:0;right:0;top:21px;height:6px;border-radius:3px;background:var(--sunk)}
.strip .tick{position:absolute;top:36px;font-size:.68rem;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums;font-weight:600}
.strip .now{position:absolute;top:11px;width:2px;height:26px;margin-left:-1px;background:var(--accent);border-radius:1px}
.strip i{position:absolute;display:block}
.strip .m{top:15px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.strip .s{top:16px;width:16px;height:16px;margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.strip .p{top:1px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);border-radius:2px;background:var(--b-liquid)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:8px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .lg-m{background:transparent;border:2px solid var(--ink)}
.legend .lg-p{border-radius:2px;transform:rotate(45deg) scale(.85);background:var(--b-liquid)}
.legend .lg-sq{border-radius:3px}

/* Schnell-Erfassung */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick button{min-height:92px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:.9rem;padding:8px 4px;text-align:center;line-height:1.2}
.quick .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.quick svg{width:22px;height:22px}

/* Einträge */
.timeline{list-style:none;margin:0;padding:0}
.timeline li + li .entry{border-top:1px solid var(--line)}
.entry{width:100%;display:grid;grid-template-columns:44px 30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:none;border:0;padding:11px 0}
.entry .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;font-weight:600}
.badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.82rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.badge.meal{background:var(--sunk);color:var(--ink)}
.badge.meal svg{width:16px;height:16px}
.entry .what{min-width:0}
.entry .what b{display:block;font-weight:700;overflow-wrap:anywhere}
.entry .what small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:2px 0}

.c-hard{background:var(--b-hard)} .c-ok{background:var(--b-ok)} .c-soft{background:var(--b-soft)} .c-liquid{background:var(--b-liquid)} .c-pain{background:var(--b-liquid)}

/* Zähler */
.counter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0}
.counter + .counter{border-top:1px solid var(--line)}
.counter .name b{display:block;font-weight:700}
.counter .name small{color:var(--muted);font-size:.82rem}
.stepper{display:flex;align-items:center;border-radius:14px;overflow:hidden;background:var(--sunk)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:1.35rem;line-height:1;font-weight:600}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}

/* Chips und Felder */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem;font-weight:600;display:inline-flex;align-items:center}
.chip[aria-pressed="true"],.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip .x{margin-left:7px;font-size:1.05rem;line-height:1;opacity:.85}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale .chip{padding:0;min-height:42px;border-radius:12px;justify-content:center;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--sunk);border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:11px;font-weight:700;font-size:.88rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:flex;flex-direction:column;gap:7px}
.field + .field{margin-top:16px}
textarea,input[type=text],input[type=search],input[type=datetime-local]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--sunk);padding:11px 13px;min-height:46px}
textarea{min-height:76px;resize:vertical}

/* Bristol */
.bristol{display:flex;flex-direction:column;gap:6px}
.bristol button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;min-height:48px}
.bristol button .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.bristol button small{color:var(--muted);font-size:.8rem}
.bristol button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

/* Lebensmittel */
.foodgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:232px;overflow:auto;padding:2px 0}
.bgbox{background:var(--accent-soft);border-radius:16px;padding:13px 14px}
.bgbox ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.bgbox li{font-size:.92rem;line-height:1.35}
.bgbox li small{display:block;color:var(--muted);font-size:.82rem}
.bgbox .field{margin-top:12px}
.ptag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin:3px 4px 0 0;white-space:nowrap}
.flist{list-style:none;margin:0;padding:0}
.flist li + li{border-top:1px solid var(--line)}
.frow{width:100%;background:none;border:0;text-align:left;padding:11px 0;display:flex;flex-direction:column;gap:2px}
.frow .nm{font-weight:700}

/* Buttons */
.btn{min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--b-liquid);border-color:var(--b-liquid);background:transparent}
.btn.danger.armed{background:var(--b-liquid);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 120px}
.icon-btn{width:42px;height:42px;border-radius:13px;border:0;background:var(--sunk);display:grid;place-items:center;font-size:1.3rem;line-height:1;flex:none}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .inner{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(16,21,34,.14);padding:5px}
.tabs button{border:0;background:none;min-height:54px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(6,9,16,.48);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:calc(100% - 64px);overflow:auto;-webkit-overflow-scrolling:touch;padding-block:6px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -12px 40px rgba(0,0,0,.22)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-6px;z-index:2;background:var(--bg);padding-block:10px}
.sheet-head h2{flex:1;min-width:0;font-size:1.3rem}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:12px;margin-top:18px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.err{color:var(--b-liquid);font-weight:700;font-size:.9rem;margin-top:10px}
.info-p + .info-p{margin-top:12px}
.info-p p{margin-top:3px;font-size:.94rem}

/* Verlauf */
.days{list-style:none;margin:0;padding:0}
.days li + li{border-top:1px solid var(--line)}
.dayrow{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.dayrow .d{font-weight:700}
.dayrow .meta{grid-column:1 / -1;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:3px 12px}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.pips i{width:11px;height:11px;border-radius:50%;display:block}

/* Auswertung */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.f-ok{fill:var(--b-ok)} .f-loose{fill:var(--b-soft)} .f-liquid{fill:var(--b-liquid)} .f-acc{fill:var(--accent)} .f-none{fill:var(--line)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.9rem}
.cmp .bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-bottom:6px}
.cmp .bar span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.cmp .bar.b span{background:var(--muted)}
.cmp b{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.fc{list-style:none;margin:6px 0 0;padding:0}
.fc li + li{border-top:1px solid var(--line)}
.fcrow{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;align-items:center}
.fcrow .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pill{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.duo{grid-column:1 / -1;display:grid;grid-template-columns:36px minmax(0,1fr) 46px;gap:5px 8px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.duo .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.duo .bar span{display:block;height:100%;border-radius:4px;background:var(--b-liquid)}
.duo .bar.wo span{background:var(--muted)}
.duo b{font-variant-numeric:tabular-nums;color:var(--ink);text-align:right}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{font-size:.92rem;flex:1 1 200px}
.banner button{background:var(--surface);border:0;border-radius:11px;color:var(--accent);font-weight:800;min-height:38px;padding:6px 12px;white-space:nowrap}
pre.summary{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:14px;padding:12px;font-size:.86rem;margin:0;font-family:var(--f-body);max-height:320px;overflow:auto}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .sheet:not([hidden]){animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<div id="app">
  <div id="view"></div>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="inner">
  <button data-tab="heute" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Tag</button>
  <button data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Verlauf</button>
  <button data-tab="auswertung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Auswertung</button>
  <button data-tab="daten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Daten</button>
</div></nav>

<div class="scrim" hidden></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
const STANDALONE = !!window.DT_STANDALONE;
const KEY = 'darmtagebuch.v1';
const DRAFT_KEY = 'darmtagebuch.entwurf';
let S = {v:1, entries:[], days:{}, meta:{}};
let storageOK = true;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.entries)) S = {v:1, entries:d.entries, days:d.days||{}, meta:d.meta||{}}; }
  }catch(e){ storageOK = false; }
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; } }
function save(){ saveLocal(); queueSync(); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = ms => { const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const keyDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = keyDate(k); d.setDate(d.getDate()+n); return dayKey(d.getTime()); };
const todayKey = () => dayKey(Date.now());
const fmtDate = k => keyDate(k).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDayLong = k => keyDate(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const fmtDay = k => k===todayKey() ? 'Heute' : (k===addDays(todayKey(),-1) ? 'Gestern' : fmtDayLong(k));
const fmtTime = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const num = (x,d=1) => (x==null || isNaN(x)) ? '–' : Number(x).toLocaleString('de-DE',{maximumFractionDigits:d});
const pct = x => (x==null || isNaN(x)) ? '–' : Math.round(x*100)+' %';
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const toLocalInput = ms => { const d = new Date(ms); return dayKey(ms)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
const fromLocalInput = v => { if(!v) return null; const [a,b] = v.split('T'); const [y,m,d] = a.split('-').map(Number); const [h,mi] = (b||'12:00').split(':').map(Number); const t = new Date(y,m-1,d,h,mi).getTime(); return isNaN(t)?null:t; };

let FMAP = new Map();
const matchCache = new Map();
function foodsList(){ return S.meta.foods || DEFAULT_FOODS; }
function ensureCustomFoods(){ if(!S.meta.foods) S.meta.foods = clone(DEFAULT_FOODS); return S.meta.foods; }
function matchText(text){
  if(!text) return [];
  const key = text.toLowerCase();
  if(matchCache.has(key)) return matchCache.get(key);
  const t = ' '+key+' ';
  const out = [];
  for(const f of foodsList()){
    const names = [f.name.toLowerCase(), ...(f.al||[])];
    if(names.some(a=>a && t.includes(a))) out.push(f.id);
  }
  matchCache.set(key, out);
  return out;
}
function mealFoods(e){
  const ids = new Set((e.foods||[]).filter(id=>FMAP.has(id)));
  matchText(e.text).forEach(id=>ids.add(id));
  return [...ids];
}
function mealProps(e){
  const p = new Set();
  mealFoods(e).forEach(id=>{ const f = FMAP.get(id); if(f) f.p.forEach(x=>p.add(x)); });
  (e.flags||[]).forEach(id=>{ const fl = FLAGS.find(x=>x.id===id); if(fl) fl.props.forEach(x=>p.add(x)); });
  (e.tags||[]).forEach(t=>(OLD_TAGS[t]||[]).forEach(x=>p.add(x)));
  return p;
}
function mealItems(e){ return [...mealFoods(e).map(id=>'f:'+id), ...[...mealProps(e)].map(p=>'p:'+p)]; }
function itemName(it){ const id = it.slice(2); if(it[0]==='f'){ const f = FMAP.get(id); return f ? f.name : 'Gelöschtes Lebensmittel'; } return PROPS[id] ? PROPS[id].name : id; }

function dayStats(k){
  const es = byDay[k] || [];
  const st = es.filter(e=>e.type==='stool'), pa = es.filter(e=>e.type==='pain'), me = es.filter(e=>e.type==='meal');
  const d = S.days[k] || {};

  const tracked = es.length>0 || COUNTERS.some(c=>(d[c.k]||0)>0) || d.stress!=null || !!d.dtype || !!(d.note||'').trim();
  return {
    k, es, st, pa, me, tracked,

    avgB: br.length ? avg(br) : null,

    beer:d.beer||0, cigs:d.cigs||0, coffee:d.coffee||0, lop:d.lop||0, chol:d.chol||0, psyll:d.psyll||0, mint:d.mint||0,
    stress: d.stress ?? null, dtype: d.dtype || null, note: d.note || ''
  };
}

let COL = null, synced = false, lastSent = {}, writing = false, wTimer = null, syncState = STANDALONE ? 'device' : 'init', errShown = false;
const SYNC_TEXT = {
  init:'Verbinde mit deinem Claude-Konto …',
  ok:'Synchronisiert mit deinem Claude-Konto. PC und Handy zeigen dieselben Daten.',
  wait:'Dein Konto ist gerade nicht erreichbar. Neue Einträge bleiben auf diesem Gerät und werden übertragen, sobald die Verbindung steht.',
  err:'Synchronisieren hat nicht geklappt. Deine Einträge sind auf diesem Gerät gesichert. Lade die Seite später neu.',
  local:'Nur auf diesem Gerät gespeichert, weil keine Verbindung zum Claude-Konto besteht.',
  device:'Gespeichert nur auf diesem Handy, in dieser App. Mach ab und zu eine Sicherung und leg sie in einer Notiz ab.'
};
function setSync(st){
  syncState = st;
  const el = document.getElementById('syncstate'); if(el) el.textContent = SYNC_TEXT[st];
  if(st==='err' && !errShown){ errShown = true; toast('Synchronisieren fehlgeschlagen'); }
}
function payloads(){
  index();
  const out = {};
  const keys = new Set([...Object.keys(byDay), ...Object.keys(S.days), ...Object.keys(lastSent).filter(k=>k.startsWith('d-')).map(k=>k.slice(2))]);
  keys.forEach(k=>{
    const es = byDay[k] || []; const d = S.days[k] || {};
    const has = es.length || Object.keys(d).some(x=>d[x]!=null && d[x]!==0 && d[x]!=='');
    out['d-'+k] = has ? {entries:es, day:d} : null;
  });
  const m = {lastBackup:S.meta.lastBackup||0, hintDone:!!S.meta.hintDone, show:S.meta.show||{}, win:S.meta.win||3};
  if(S.meta.foods) m.foods = S.meta.foods;
  out.meta = m;
  return out;
}
function queueSync(){ if(!COL || !synced) return; clearTimeout(wTimer); wTimer = setTimeout(flush, 600); }
async function flush(){
  wTimer = null;
  if(writing){ wTimer = setTimeout(flush, 400); return; }
  writing = true;
  try{
    const p = payloads();
    for(const [id, body] of Object.entries(p)){
      const js = body ? JSON.stringify(body) : null;
      if((lastSent[id] ?? null) === js) continue;
      if(body) await COL.doc(id).set(JSON.parse(js)); else await COL.doc(id).delete();
      if(js==null) delete lastSent[id]; else lastSent[id] = js;
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
  finally{ writing = false; }
}
function readRemote(snap){
  const r = {entries:[], days:{}, meta:null, sent:{}};
  snap.docs.forEach(doc=>{
    const d = doc.data(); if(!d) return;
    r.sent[doc.id] = JSON.stringify(d);
    if(doc.id==='meta') r.meta = clone(d);
    else if(doc.id.startsWith('d-')){
      (d.entries||[]).forEach(e=>r.entries.push(clone(e)));
      if(d.day && Object.keys(d.day).length) r.days[doc.id.slice(2)] = clone(d.day);
    }
  });
  return r;
}
function busyTyping(){ const a = document.activeElement; return !!(a && (a.id==='daynote' || a.id==='importbox')); }
function onRemote(snap){
  const r = readRemote(snap);
  if(!synced){
    const ids = new Set(r.entries.map(e=>e.id));
    const entries = r.entries.concat(S.entries.filter(e=>!ids.has(e.id)));
    const days = Object.assign({}, S.days);
    Object.entries(r.days).forEach(([k,v])=>{ days[k] = Object.assign({}, S.days[k]||{}, v); });
    const meta = Object.assign({}, S.meta, r.meta||{}, {show:Object.assign({}, S.meta.show||{}, (r.meta||{}).show||{})});
    if(!(r.meta && r.meta.foods) && S.meta.foods) meta.foods = S.meta.foods;
    S = {v:1, entries, days, meta};
    lastSent = r.sent; synced = true; setSync('ok');
    saveLocal(); queueSync();
    if(!busyTyping() && !sheetMode) render();
    return;
  }
  if(snap.metadata.hasPendingWrites || writing || wTimer) return;
  S = {v:1, entries:r.entries, days:r.days, meta:Object.assign({}, S.meta, r.meta||{})};
  lastSent = r.sent; saveLocal(); setSync('ok');
  if(!busyTyping() && !sheetMode) render();
}
async function initSync(){
  try{
    if(!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync('local'); return; }
    COL = db.collection('data/users/'+id);
    const t = setTimeout(()=>{ if(!synced) setSync('wait'); }, 10000);
    COL.onSnapshot(snap=>{
      if(snap.metadata.fromCache && !synced) return;
      clearTimeout(t); onRemote(snap);
    }, ()=>{ clearTimeout(t); setSync(synced?'err':'local'); });
  }catch(e){ setSync('local'); }
}

function stripHTML(s){
  const pos = t => { const d = new Date(t); let h = d.getHours()+d.getMinutes()/60; h = Math.min(24, Math.max(6, h)); return ((h-6)/18*100).toFixed(2); };
  let marks = '';
  s.me.forEach(e=>{ marks += `<i class="m" style="left:${pos(e.t)}%"></i>`; });
  s.st.forEach(e=>{ marks += `<i class="s c-${(BRISTOL[e.bristol]||{c:'ok'}).c}" style="left:${pos(e.t)}%"></i>`; });
  s.pa.forEach(e=>{ marks += `<i class="p" style="left:${pos(e.t)}%"></i>`; });
  const ticks = [6,9,12,15,18,21,24].map(h=>`<span class="tick" style="left:${((h-6)/18*100).toFixed(2)}%">${h}</span>`).join('');

  return `<div class="strip" aria-hidden="true"><div class="track"></div>${now}${marks}${ticks}</div>

/* ---------- Sheets ---------- */
function sheetHead(title, back){
  return `<div class="grab"></div><div class="sheet-head">${back?`<button class="icon-btn" data-act="${back}" aria-label="Zurück">‹</button>`:''}<h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Schließen">×</button></div>`;
}
function showSheet(html){
  const sh = $('.sheet');
  sh.innerHTML = html; sh.hidden = false; $('.scrim').hidden = false; sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  const wasEntry = sheetMode==='entry';
  $('.sheet').hidden = true; $('.scrim').hidden = true;
  draft = null; sheetMode = null;
  if(wasEntry) clearStash();
  document.body.style.overflow = '';
}

/* Entwurf zwischenspeichern */
function readInputs(){
  const sh = $('.sheet'); if(!draft || !sh) return;
  const w = sh.querySelector('#when'); if(w){ const t = fromLocalInput(w.value); if(t!=null) draft.t = t; }
  const n = sh.querySelector('#enote'); if(n) draft.note = n.value;
  const m = sh.querySelector('#meal-text'); if(m) draft.text = m.value;
}
function stashDraft(){ if(sheetMode!=='entry' || !draft) return; readInputs(); try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({d:draft, at:Date.now()})); }catch(e){} }
function getStash(){ try{ const r = JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(r && r.d && Date.now()-r.at < 3*3600e3) return r.d; }catch(e){} return null; }
function clearStash(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

function defaultTime(){
  if(cur===todayKey()) return Date.now();
  const d = keyDate(cur); d.setHours(12,0,0,0); return d.getTime();
}
let foodUsage = {}, foodQuery = '', newFoodIds = new Set();
function computeUsage(){ foodUsage = {}; S.entries.forEach(e=>{ if(e.type==='meal') mealFoods(e).forEach(id=>{ foodUsage[id] = (foodUsage[id]||0)+1; }); }); }
function sortedFoods(){ return foodsList().map((f,i)=>({f,i})).sort((a,b)=>(foodUsage[b.f.id]||0)-(foodUsage[a.f.id]||0) || a.i-b.i).map(x=>x.f); }

function openSheet(type, id, restored){
  index();
  const e = id ? S.entries.find(x=>x.id===id) : null;
  const st = restored || getStash();
  if(st && ((id && st.id===id) || (!id && !st.id && st.type===type))) draft = clone(st);
  else if(e) draft = clone(e);
  else {
    draft = {id:null, type, t:defaultTime(), note:''};
    if(type==='stool'){ draft.bristol=null; draft.urgent=false; draft.fatty=false; draft.burn=false; }
    if(type==='pain'){ draft.pain=null; draft.loc=[]; draft.kind=[]; }
  }
  if(draft.type==='meal'){
    if(!Array.isArray(draft.foods)) draft.foods = matchText(draft.text);
    if(!Array.isArray(draft.flags)) draft.flags = [];
    foodQuery = ''; newFoodIds = new Set(); computeUsage();
  }
  sheetMode = 'entry';
  showSheet(entrySheetHTML());
  stashDraft();
}
function selHTML(){
  const ids = draft.foods||[];
  if(!ids.length) return '<span class="note">Noch nichts ausgewählt. Tipp unten auf Lebensmittel oder such danach.</span>';
  return ids.map(id=>{ const f = FMAP.get(id); return f ? `<button class="chip sel" data-foodtoggle="${esc(id)}" aria-label="${esc(f.name)} entfernen">${esc(f.name)}<span class="x">×</span></button>` : ''; }).join('');
}
function gridHTML(){
  const q = foodQuery.trim().toLowerCase();
  let list = sortedFoods().filter(f=>!(draft.foods||[]).includes(f.id));
  if(q) list = list.filter(f=>f.name.toLowerCase().includes(q) || (f.al||[]).some(a=>a.trim().includes(q)));
  let h = list.map(f=>`<button class="chip" data-foodtoggle="${esc(f.id)}">${esc(f.name)}</button>`).join('');
  if(q && !foodsList().some(f=>f.name.toLowerCase()===q)) h += `<button class="chip add" data-newfood="1">+ „${esc(foodQuery.trim())}“ neu anlegen</button>`;
  return h || '<span class="note">Alles ausgewählt.</span>';
}
function bgHTML(){
  const props = new Map();
  const add = (p, src) => { if(!PROPS[p]) return; if(!props.has(p)) props.set(p, new Set()); props.get(p).add(src); };
  (draft.foods||[]).forEach(id=>{ const f = FMAP.get(id); if(f) f.p.forEach(p=>add(p, f.name)); });
  (draft.flags||[]).forEach(id=>{ const fl = FLAGS.find(x=>x.id===id); if(fl) fl.props.forEach(p=>add(p, fl.name)); });
  (draft.tags||[]).forEach(t=>(OLD_TAGS[t]||[]).forEach(p=>add(p, t)));
  let h = '<span class="label">Was drinsteckt</span>';
  if(!(draft.foods||[]).length && !(draft.flags||[]).length) h += '<p class="note" style="margin-top:6px">Wähle Lebensmittel. Hier siehst du dann, was davon für deinen Darm relevant ist.</p>';
  else if(!props.size) h += '<p class="note" style="margin-top:6px">Nichts Auffälliges in dieser Auswahl.</p>';
  else h += `<ul>${[...props].map(([p,src])=>`<li><b>${esc(PROPS[p].name)}</b> <span class="muted">· ${esc([...src].join(', '))}</span><small>${esc(PROPS[p].short)}</small></li>`).join('')}</ul>`;
  (draft.foods||[]).filter(id=>newFoodIds.has(id)).map(id=>FMAP.get(id)).filter(Boolean).forEach(f=>{
    h += `<div class="field"><span class="note">Was steckt in <b>${esc(f.name)}</b>? Optional, lässt sich später unter Daten ändern.</span><div class="chips">${PROP_PICK.map(p=>`<button class="chip" data-fprop="${esc(f.id)}" data-pid="${p}" aria-pressed="${f.p.includes(p)}">${esc(PROPS[p].name)}</button>`).join('')}</div></div>`;
  });
  return h;
}
function refreshMeal(){
  const sh = $('.sheet'); if(!sh) return;
  const a = sh.querySelector('#selfoods'), b = sh.querySelector('#foodgrid'), c = sh.querySelector('#bgbox');
  if(a) a.innerHTML = selHTML(); if(b) b.innerHTML = gridHTML(); if(c) c.innerHTML = bgHTML();
}

function saveEntry(){
  const sh = $('.sheet');
  const err = sh.querySelector('#sheet-err');
  const t = fromLocalInput(sh.querySelector('#when').value);
  draft.note = sh.querySelector('#enote').value.trim();
  if(draft.type==='meal') draft.text = sh.querySelector('#meal-text').value.trim();
  let msg = '';
  if(t==null) msg = 'Bitte einen gültigen Zeitpunkt wählen.';
  else if(draft.type==='stool' && !draft.bristol) msg = 'Bitte die Konsistenz wählen.';
  else if(draft.type==='pain' && !draft.pain) msg = 'Bitte die Stärke wählen.';
  else if(draft.type==='meal' && !(draft.foods||[]).length && !draft.text && !(draft.flags||[]).length && !(draft.tags||[]).length) msg = 'Bitte mindestens ein Lebensmittel wählen oder kurz beschreiben, was es gab.';
  if(msg){ err.textContent = msg; err.hidden = false; err.scrollIntoView({block:'nearest'}); return; }
  draft.t = t;
  const isNew = !draft.id;
  if(isNew){ draft.id = uid(); S.entries.push(draft); }
  else { const i = S.entries.findIndex(x=>x.id===draft.id); if(i>=0) S.entries[i] = draft; else S.entries.push(draft); }
  cur = dayKey(t);
  save(); closeSheet(); render();
  toast(isNew ? 'Gespeichert' : 'Änderung gespeichert');
}
function createFoodFromQuery(){
  const name = foodQuery.trim(); if(!name) return;
  const id = 'u'+uid();
  ensureCustomFoods().push({id, name, al:[name.toLowerCase()], p:[], custom:true});
  index();
  draft.foods.push(id); newFoodIds.add(id);
  save(); clearQuery(); refreshMeal(); stashDraft();
  toast('„'+name+'“ neu angelegt');
}
function clearQuery(){ foodQuery = ''; const q = $('#foodq'); if(q){ q.value = ''; q.focus(); } }
function addFromQuery(){
  const q = foodQuery.trim(); if(!q) return;
  const ql = q.toLowerCase();
  let f = foodsList().find(x=>x.name.toLowerCase()===ql || (x.al||[]).some(a=>a.trim()===ql));
  if(!f) f = sortedFoods().find(x=>x.name.toLowerCase().startsWith(ql));
  if(!f){ createFoodFromQuery(); return; }
  draft.foods = draft.foods || [];
  if(!draft.foods.includes(f.id)) draft.foods.push(f.id);
  clearQuery(); refreshMeal(); stashDraft();
}

        ${s.pain?`<span>${s.pain}× Schmerzen</span>`:''}
        ${s.me.length?`<span>${s.me.length}× Essen</span>`:''}
        ${s.beer?`<span>${s.beer}× Bier</span>`:''}
        ${s.cigs?`<span>${s.cigs} Zig.</span>`:''}
        ${s.stress!=null?`<span>Stress ${s.stress}</span>`:''}
        ${s.dtype?`<span>${esc(s.dtype)}</span>`:''}
      </span>
    </button></li>`).join('');
  return `
  <div class="top"><div><div class="eyebrow">${list.length} erfasste Tage</div><h1>Verlauf</h1></div></div>
  <div class="stack">
    <div class="card">
      ${rows ? `<ul class="days">${rows}</ul>` : `<p class="empty">Sobald du Einträge machst, erscheint hier jeder Tag mit Stuhlgängen, Konsistenz und den gezählten Werten. Tipp auf einen Tag, um ihn zu bearbeiten.</p>`}
    </div>
    <div class="legend"><span><i class="c-hard"></i>Typ 1–2 hart</span><span><i class="c-ok"></i>Typ 3–4 normal</span><span><i class="c-soft"></i>Typ 5–6 weich</span><span><i class="c-liquid"></i>Typ 7 wässrig</span></div>
  </div>`;
}

/* ---------- Auswertung ---------- */
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }

function foodCheck(tr, winH){
  const W = winH*3600e3, now = Date.now();
  const trSet = new Set(tr.map(d=>d.k));
  const meals = S.entries.filter(e=>e.type==='meal' && trSet.has(dayKey(e.t)) && now-e.t >= W);
  const stools = S.entries.filter(e=>e.type==='stool');
  const pains = S.entries.filter(e=>e.type==='pain');
  const rows = meals.map(m=>{
    const bad = stools.some(s=>s.t>m.t && s.t-m.t<=W && (s.bristol>=6 || s.urgent)) || pains.some(p=>p.t>m.t && p.t-m.t<=W && (p.pain||0)>=3);
    return {items:new Set(mealItems(m)), bad};
  });
  const counts = {};
  rows.forEach(r=>r.items.forEach(it=>{ counts[it] = (counts[it]||0)+1; }));
  const out = [];
  Object.keys(counts).forEach(it=>{
    const w = rows.filter(r=>r.items.has(it)), wo = rows.filter(r=>!r.items.has(it));
    if(w.length<3 || wo.length<3) return;
    const bw = w.filter(r=>r.bad).length, bwo = wo.filter(r=>r.bad).length;
    const rw = bw/w.length, rwo = bwo/wo.length;
    out.push({it, nw:w.length, bw, nwo:wo.length, bwo, rw, rwo, diff:rw-rwo, win:winH});
  });
  out.sort((a,b)=>b.diff-a.diff || b.nw-a.nw);
  return {rows:out, meals:meals.length, badMeals:rows.filter(r=>r.bad).length};
}
function verdict(r){
  if(r.diff>=0.25 && r.bw>=2) return {t:'Auffällig', c:'warn'};
  if(r.diff<=-0.25) return {t:'Eher gut', c:'good'};
  return {t:'Unauffällig', c:''};
}

function analyze(n){
  const keys = rangeKeys(n);
  const ds = keys.map(dayStats);
  const tr = ds.filter(d=>d.tracked);
  const all = {};
  const getS = k => all[k] || (all[k] = dayStats(k));
  const R = {keys, ds, tr, insights:[], pending:[]};
  if(!tr.length) return R;

  const stools = tr.flatMap(d=>d.st);
  R.avgStool = avg(tr.map(d=>d.stool));
  R.minStool = Math.min(...tr.map(d=>d.stool)); R.maxStool = Math.max(...tr.map(d=>d.stool));
  R.avgB = avg(stools.map(e=>e.bristol).filter(Boolean));
  R.loosePct = stools.length ? stools.filter(e=>e.bristol>=6).length/stools.length : null;
  R.urgentPct = stools.length ? stools.filter(e=>e.urgent).length/stools.length : null;
  R.fattyPct = stools.length ? stools.filter(e=>e.fatty).length/stools.length : null;
  R.burnPct = stools.length ? stools.filter(e=>e.burn).length/stools.length : null;
  const pains = tr.flatMap(d=>d.pa);
  R.painCount = pains.length; R.painAvg = avg(pains.map(e=>e.pain||0));
  const locs = {}; pains.forEach(p=>(p.loc||[]).forEach(l=>{ locs[l]=(locs[l]||0)+1; }));
  R.painLocs = Object.entries(locs).sort((a,b)=>b[1]-a[1]);
  ['beer','cigs','coffee','lop','chol'].forEach(k=>{ R['avg_'+k] = avg(tr.map(d=>d[k])); });

  R.win = S.meta.win || 3;
  R.fc = foodCheck(tr, R.win);

  const meals = S.entries.filter(e=>e.type==='meal');
  if(stools.length >= 4 && meals.length){
    const after = stools.filter(s=>meals.some(m=>s.t-m.t>=0 && s.t-m.t<=120*60000));
    R.afterMealPct = after.length/stools.length;
    const painsAfter = pains.filter(p=>meals.some(m=>p.t-m.t>=0 && p.t-m.t<=120*60000));
    R.painAfterMealPct = pains.length ? painsAfter.length/pains.length : null;
    R.insights.push({title:'Stuhlgang bis 2 Stunden nach dem Essen', single:true, big:pct(R.afterMealPct), sub:`${after.length} von ${stools.length} Stuhlgängen${pains.length?` · Schmerzen nach dem Essen: ${pct(R.painAfterMealPct)}`:''}`});
  }

  function cmp(title, la, a, lb, b, unit, hint){
    if(a.length<2 || b.length<2){ R.pending.push(title); return; }
    R.insights.push({title, la, lb, va:avg(a), vb:avg(b), na:a.length, nb:b.length, unit, hint});
  }
  {
    const A=[], B=[];
    tr.forEach(d=>{ const nx = getS(addDays(d.k,1)); if(!nx.tracked || nx.k>todayKey()) return; (d.fatMeal?A:B).push(nx.stool); });
    cmp('Fettreiches Essen → Stuhlgänge am Folgetag','nach fettreichem Tag',A,'sonst',B,'Stuhlgänge');
  }
  {
    const vals = tr.map(d=>d.beer); const m = median(vals);
    if(m!=null && Math.max(...vals)>Math.min(...vals)){
      const A=[], B=[];
      tr.forEach(d=>{ const nx = getS(addDays(d.k,1)); if(!nx.tracked) return; (d.beer>m?A:B).push(nx.stool); });
      cmp('Bier am Abend → Stuhlgänge am Folgetag',`mehr als ${num(m)} × 500 ml`,A,`${num(m)} oder weniger`,B,'Stuhlgänge');
    } else R.pending.push('Bier am Abend → Stuhlgänge am Folgetag');
  }
  {
    const vals = tr.map(d=>d.cigs); const m = median(vals);
    if(m!=null && Math.max(...vals)>Math.min(...vals)){
      cmp('Zigaretten → Stuhlgänge am selben Tag',`mehr als ${num(m,0)} Zigaretten`,tr.filter(d=>d.cigs>m).map(d=>d.stool),`${num(m,0)} oder weniger`,tr.filter(d=>d.cigs<=m).map(d=>d.stool),'Stuhlgänge');
    } else R.pending.push('Zigaretten → Stuhlgänge am selben Tag');
  }
  {
    const s = tr.filter(d=>d.stress!=null);
    cmp('Stress → Stuhlgänge am selben Tag','Stress 6–10',s.filter(d=>d.stress>=6).map(d=>d.stool),'Stress 1–5',s.filter(d=>d.stress<=5).map(d=>d.stool),'Stuhlgänge');
  }
  {
    const groups = DTYPES.map(t=>({t, v:tr.filter(d=>d.dtype===t)})).filter(g=>g.v.length);
    if(groups.filter(g=>g.v.length>=2).length>=2){
      R.dtypeRows = groups.map(g=>({l:g.t, n:g.v.length, v:avg(g.v.map(d=>d.stool)), p:avg(g.v.map(d=>d.pain))}));
      R.insights.push({multi:true, title:'Art des Tages → Stuhlgänge', rows:R.dtypeRows});
    } else R.pending.push('Büro, Homeoffice, frei oder Reise');
  }

  const allKeys = [...new Set([...Object.keys(byDay), ...Object.keys(S.days)])].sort();
  const start = allKeys.find(k=>(S.days[k]||{}).chol>0);
  if(start){
    const before=[], after=[];
    for(let i=1;i<=14;i++){ const s=getS(addDays(start,-i)); if(s.tracked) before.push(s); }
    for(let k=start; k<=todayKey(); k=addDays(k,1)){ const s=getS(k); if(s.tracked) after.push(s); }
    const f = arr => { const st=arr.flatMap(d=>d.st); return {n:arr.length, stool:avg(arr.map(d=>d.stool)), loose: st.length? st.filter(e=>e.bristol>=6).length/st.length : null, pain:avg(arr.map(d=>d.pain)), lop:avg(arr.map(d=>d.lop))}; };
    R.chol = {start, before:f(before), after:f(after), days: Math.round((keyDate(todayKey())-keyDate(start))/864e5)+1};
  }
  return R;
}

function chartSVG(ds, field, opts){
  const n = ds.length, W = 340, H = opts.h||140, pl = 20, pr = 4, pt = 8, pb = 18;
  const iw = W-pl-pr, ih = H-pt-pb, cw = iw/n, bw = Math.max(2.5, Math.min(18, cw*0.64));
  const vals = ds.map(d=>d[field]);
  const max = Math.max(opts.minMax||4, ...vals);
  const step = max>12 ? Math.ceil(max/4) : (max>6 ? 2 : 1);
  const top = Math.ceil(max/step)*step;
  const y = v => pt + ih - (v/top)*ih;
  let g = '';
  for(let v=0; v<=top; v+=step){ g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  let bars = '';
  const every = n<=7 ? 1 : (n<=14 ? 2 : 5);
  ds.forEach((d,i)=>{
    const x = pl + i*cw + (cw-bw)/2;
    if(!d.tracked){ bars += `<rect class="f-none" x="${x}" y="${y(0)-1.5}" width="${bw}" height="1.5"/>`; }
    else if(opts.stack){
      const loose = d.loose - d.liquid, liquid = d.liquid, rest = d.stool - d.loose;
      let base = 0;
      [[rest,'f-ok'],[loose,'f-loose'],[liquid,'f-liquid']].forEach(([v,c])=>{ if(v>0){ bars += `<rect class="${c}" x="${x}" y="${y(base+v)}" width="${bw}" height="${y(base)-y(base+v)}" rx="2"/>`; base+=v; } });
    } else if(d[field]>0){
      bars += `<rect class="f-acc" x="${x}" y="${y(d[field])}" width="${bw}" height="${y(0)-y(d[field])}" rx="2"/>`;
    }
    if(i%every===0 || i===n-1){ const dd = keyDate(d.k); bars += `<text x="${pl+i*cw+cw/2}" y="${H-5}" text-anchor="middle">${dd.getDate()}.${n<=7?(dd.getMonth()+1)+'.':''}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}${bars}</svg>`;
}

function insightHTML(it){
  if(it.multi){
    const mx = Math.max(...it.rows.map(r=>r.v), 0.1);
    return `<div class="card"><h3 style="margin-bottom:10px">${esc(it.title)}</h3><div class="cmp">${it.rows.map(r=>`<span>${esc(r.l)} <span class="muted">(${r.n} ${r.n===1?'Tag':'Tage'})</span></span><b>${num(r.v)}</b><div class="bar"><span style="width:${(r.v/mx*100).toFixed(1)}%"></span></div>`).join('')}</div><p class="note">Ø Stuhlgänge pro Tag. Schmerzen pro Tag: ${it.rows.map(r=>esc(r.l)+' '+num(r.p)).join(' · ')}</p></div>`;
  }
  if(it.single) return `<div class="card"><h3 style="margin-bottom:8px">${esc(it.title)}</h3><div class="big">${it.big}</div><p class="note" style="margin-top:4px">${esc(it.sub)}</p></div>`;
  const mx = Math.max(it.va, it.vb, 0.1);
  const diff = it.vb>0 ? (it.va-it.vb)/it.vb : null;
  const v = Math.abs(it.va-it.vb) < 0.5 ? 'Kaum Unterschied.' : (it.va>it.vb ? `Ø ${num(it.va-it.vb)} ${it.unit} mehr${diff!=null?` (+${Math.round(diff*100)} %)`:''}.` : `Ø ${num(it.vb-it.va)} ${it.unit} weniger.`);
  return `<div class="card"><h3 style="margin-bottom:10px">${esc(it.title)}</h3>
    <div class="cmp">
      <span>${esc(it.la)} <span class="muted">(${it.na} Tage)</span></span><b>${num(it.va)}</b>
      <div class="bar"><span style="width:${(it.va/mx*100).toFixed(1)}%"></span></div>
      <span>${esc(it.lb)} <span class="muted">(${it.nb} Tage)</span></span><b>${num(it.vb)}</b>
      <div class="bar b"><span style="width:${(it.vb/mx*100).toFixed(1)}%"></span></div>
    </div>
    <p class="note">${v}</p></div>`;
}
function foodCheckHTML(R){
  const fc = R.fc; lastFC = fc.rows;
  const seg = `<div class="seg" role="group" aria-label="Zeitfenster nach dem Essen">${[2,3,4].map(h=>`<button data-win="${h}" aria-pressed="${R.win===h}">${h} h</button>`).join('')}</div>`;
  let list = '';
  if(!fc.rows.length){
    list = `<p class="empty" style="margin-top:12px">Noch zu wenig Mahlzeiten. Ein Lebensmittel erscheint hier, sobald es mindestens dreimal gegessen wurde und es mindestens drei Mahlzeiten ohne gibt. Bisher ausgewertet: ${fc.meals} ${fc.meals===1?'Mahlzeit':'Mahlzeiten'}.</p>`;
  } else {
    const shown = fcAll ? fc.rows : fc.rows.slice(0,8);

    </button></li>`; }).join('')}</ul>

  }

    <div class="card-head"><h2>Lebensmittel-Check</h2></div>
    <div style="margin-bottom:10px">${seg}</div>

    ${list}
    ${fc.rows.length ? '<p class="note" style="margin-top:10px">Ab etwa zehn Mahlzeiten pro Lebensmittel werden die Zahlen belastbar. Wer oft zusammen gegessen wird, etwa Toast und Salami, lässt sich erst trennen, wenn du beides auch mal einzeln isst.</p>' : ''}
  </div>`;
}

function summaryText(){
  index();
  const R = analyze(range);
  if(!R.tr.length) return 'Noch keine Daten im gewählten Zeitraum.';
  const first = R.tr[0].k, last = R.tr[R.tr.length-1].k;
  const L = [];
  L.push('Darmtagebuch – Zusammenfassung');
  L.push(`Zeitraum: ${fmtDate(first)} – ${fmtDate(last)} (${R.tr.length} erfasste Tage)`);
  L.push('');
  L.push(`Stuhlgang: Ø ${num(R.avgStool)} pro Tag (min. ${R.minStool}, max. ${R.maxStool})`);
  L.push(`Konsistenz (Bristol): Ø Typ ${num(R.avgB)}; Typ 6–7 bei ${pct(R.loosePct)} der Stuhlgänge`);
  L.push(`Dringend: ${pct(R.urgentPct)} · fettig/hell: ${pct(R.fattyPct)} · Brennen: ${pct(R.burnPct)}`);
  if(R.afterMealPct!=null) L.push(`Stuhlgang bis 2 h nach einer Mahlzeit: ${pct(R.afterMealPct)}`);
  if(R.painCount) L.push(`Bauchschmerzen: ${R.painCount}× (Ø Stärke ${num(R.painAvg)}/10)${R.painLocs.length?'; Orte: '+R.painLocs.map(([l,c])=>l+' '+c+'×').join(', '):''}${R.painAfterMealPct!=null?`; ${pct(R.painAfterMealPct)} bis 2 h nach dem Essen`:''}`);
  const bad = R.fc.rows.filter(r=>verdict(r).c==='warn').slice(0,6);
  if(bad.length) L.push(`Häufiger Beschwerden bis ${R.win} h nach: ${bad.map(r=>`${itemName(r.it)} (${r.bw}/${r.nw} vs. ohne ${r.bwo}/${r.nwo})`).join(', ')}`);
  const fat = R.insights.find(i=>i.title && i.title.startsWith('Fettreiches'));
  if(fat) L.push(`Nach fettreichen Tagen: Folgetag Ø ${num(fat.va)} Stuhlgänge, sonst Ø ${num(fat.vb)}`);
  if(R.dtypeRows) L.push('Stuhlgänge nach Tagesart: '+R.dtypeRows.map(r=>`${r.l} Ø ${num(r.v)} (${r.n} Tage)`).join(', '));
  L.push('');
  L.push(`Loperamid: Ø ${num(R.avg_lop)} Kapseln/Tag`);
  if(R.chol){ const c=R.chol; L.push(`Colestyramin seit ${fmtDate(c.start)}: Stuhlgänge/Tag ${c.before.n?num(c.before.stool)+' vorher → ':''}${num(c.after.stool)} seit Beginn; Typ 6–7 ${c.before.n?pct(c.before.loose)+' → ':''}${pct(c.after.loose)}`); }
  L.push(`Bier: Ø ${num(R.avg_beer)} × 500 ml/Tag · Zigaretten: Ø ${num(R.avg_cigs,0)}/Tag · Kaffee: Ø ${num(R.avg_coffee)} Tassen/Tag`);
  return L.join('\n');
}

      <div class="seg" role="group" aria-label="Zeitraum" style="margin-bottom:10px">${[7,14,30,60].map(k=>`<button data-range="${k}" aria-pressed="${range===k}">${k} Tage</button>`).join('')}</div>
      <pre class="summary" id="summary">${esc(summaryText())}</pre>
      <div class="btns" style="margin-top:10px"><button class="btn primary" data-act="copy-summary">Zusammenfassung kopieren</button></div>
      <p class="note" style="margin-top:8px">In eine Notiz oder Nachricht einfügen und zum Termin mitnehmen.</p>
    </div>

    <div class="card">
      <div class="card-head"><h2>Lebensmittel</h2><span class="muted num">${foodsList().length}</span></div>
      <p class="note" style="margin-bottom:10px">Jedes Lebensmittel hat Eigenschaften wie fettreich oder Histamin. Daraus rechnet der Lebensmittel-Check. Du kannst sie anpassen und eigene ergänzen.</p>
      <div class="btns"><button class="btn" data-act="foods">Lebensmittel bearbeiten</button></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Sicherung</h2></div>
      <p style="margin-bottom:10px">${n} Einträge, ${Object.keys(S.days).length} Tage mit Zählwerten. ${lb?`Letzte Sicherung: ${esc(new Date(lb).toLocaleDateString('de-DE'))}.`:'Noch keine Sicherung.'}</p>
      <div class="btns"><button class="btn primary" data-act="export">Sicherung kopieren</button></div>
      <p class="note" style="margin:8px 0 12px">Kopiert alle Daten samt Lebensmittel-Liste als Text. Füg ihn in eine Notiz ein oder schick ihn dir per Mail.</p>
      <textarea id="exportbox" readonly hidden aria-label="Sicherungstext"></textarea>
      <div class="field" style="margin-top:6px">
        <label class="label" for="importbox">Sicherung wiederherstellen</label>
        <textarea id="importbox" placeholder="Sicherungstext hier einfügen"></textarea>
        <div class="btns"><button class="btn" data-act="import">Einfügen und zusammenführen</button></div>
        <p class="note">Vorhandene Einträge bleiben erhalten, gleiche Einträge werden nicht doppelt angelegt.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Speicherort</h2></div>
      <p id="syncstate" style="margin-bottom:10px">${SYNC_TEXT[syncState]}</p>
      ${STANDALONE ? `<ol class="steps">
        <li>Immer über das Icon auf dem Home-Bildschirm öffnen. Das Icon hat einen eigenen Speicher, getrennt von Safari.</li>
        <li>Einträge von einem anderen Gerät übernimmst du über „Sicherung wiederherstellen“.</li>
      </ol>` : `<ol class="steps">
        <li><b>Handy:</b> Claude-App öffnen, Seitenleiste aufklappen, dort ist das Darmtagebuch angeheftet.</li>
        <li><b>PC:</b> claude.ai öffnen, ebenfalls in der Seitenleiste.</li>
      </ol>`}
      ${storageOK?'':'<p class="err">Der Browser-Speicher ist gerade nicht verfügbar, zum Beispiel im privaten Modus.</p>'}
    </div>

    <div class="card">
      <div class="card-head"><h2>Alles löschen</h2></div>
      <p class="note" style="margin-bottom:10px">Entfernt alle Einträge. Mach vorher eine Sicherung.</p>
      <div class="btns"><button class="btn danger" data-act="wipe">Alle Daten löschen</button></div>
    </div>
  </div>`;
}

async function copyText(txt, fallbackEl){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    if(fallbackEl){ fallbackEl.value = txt; fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}
function doImport(){
  const box = $('#importbox'); const raw = (box.value||'').trim();
  if(!raw){ toast('Zuerst einen Sicherungstext einfügen.'); return; }
  let d;
  try{ d = JSON.parse(raw); }catch(e){ toast('Das ist kein gültiger Sicherungstext.'); return; }
  if(!d || !Array.isArray(d.entries)){ toast('Im Text fehlen die Einträge.'); return; }
  const ids = new Set(S.entries.map(e=>e.id)); let added = 0;
  d.entries.forEach(e=>{ if(e && e.id && typeof e.t==='number' && !ids.has(e.id)){ S.entries.push(e); ids.add(e.id); added++; } });
  Object.entries(d.days||{}).forEach(([k,v])=>{ S.days[k] = Object.assign({}, S.days[k]||{}, v); });
  if(Array.isArray(d.foods)){
    const list = ensureCustomFoods();
    d.foods.forEach(f=>{ if(!f || !f.id || !f.name) return; const i = list.findIndex(x=>x.id===f.id); if(i>=0) list[i] = f; else list.push(f); });
  }
  if(d.win) S.meta.win = d.win;
  save(); box.value=''; render(); toast(`${added} Einträge wiederhergestellt`);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t=$('.toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; }, 2200); }

/* ---------- Ereignisse ---------- */
let wipeArmed = false, delArmed = null;
document.addEventListener('click', async ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const ds = b.dataset;

  if(ds.tab){ tab = ds.tab; render(); window.scrollTo(0,0); return; }
  if(ds.go){ tab = ds.go; render(); window.scrollTo(0,0); return; }
  if(ds.new){ openSheet(ds.new); return; }
  if(ds.edit){ openSheet(null, ds.edit); return; }
  if(ds.day){ cur = ds.day; tab='heute'; render(); window.scrollTo(0,0); return; }
  if(ds.range){ range = +ds.range; render(); return; }
  if(ds.win){ S.meta.win = +ds.win; save(); render(); return; }
  if(ds.info){ openInfo(ds.info); return; }
  if(ds.fedit){ openFoodEdit(ds.fedit); return; }

  if(ds.cnt){ const d = S.days[cur] = S.days[cur] || {}; d[ds.cnt] = Math.max(0, (d[ds.cnt]||0) + (+ds.d)); save(); render(); return; }
  if(ds.addmed){ S.meta.show = S.meta.show || {}; S.meta.show[ds.addmed] = true; save(); render(); return; }
  if(ds.stress){ const d = S.days[cur] = S.days[cur]||{}; const v=+ds.stress; d.stress = d.stress===v ? null : v; save(); render(); return; }
  if(ds.dtype){ const d = S.days[cur] = S.days[cur]||{}; d.dtype = d.dtype===ds.dtype ? null : ds.dtype; save(); render(); return; }

  if(sheetMode==='entry' && draft && b.closest('.sheet')){
    if(ds.pick){
      const v = +ds.val; draft[ds.pick] = draft[ds.pick]===v ? null : v;
      b.parentElement.querySelectorAll('[data-pick]').forEach(x=>x.setAttribute('aria-pressed', String(+x.dataset.val===draft[ds.pick])));
      stashDraft(); return;
    }
    if(ds.flag){ draft[ds.flag] = !draft[ds.flag]; b.setAttribute('aria-pressed', String(draft[ds.flag])); stashDraft(); return; }
    if(ds.multi){
      const arr = draft[ds.multi] = draft[ds.multi] || [];
      const i = arr.indexOf(ds.val); if(i>=0) arr.splice(i,1); else arr.push(ds.val);
      b.setAttribute('aria-pressed', String(i<0)); stashDraft(); return;
    }
    if(ds.foodtoggle){
      const id = ds.foodtoggle; draft.foods = draft.foods || [];
      const i = draft.foods.indexOf(id); if(i>=0) draft.foods.splice(i,1); else draft.foods.push(id);
      const typing = !!foodQuery.trim() || (document.activeElement && document.activeElement.id==='foodq');
      if(typing) clearQuery();
      refreshMeal(); stashDraft(); return;
    }
    if(ds.mflag){
      draft.flags = draft.flags || [];
      const i = draft.flags.indexOf(ds.mflag); if(i>=0) draft.flags.splice(i,1); else draft.flags.push(ds.mflag);
      b.setAttribute('aria-pressed', String(i<0));
      const c = $('#bgbox'); if(c) c.innerHTML = bgHTML(); stashDraft(); return;
    }
    if(ds.newfood){ createFoodFromQuery(); return; }
    if(ds.fprop){
      const f = ensureCustomFoods().find(x=>x.id===ds.fprop); if(!f) return;
      const i = f.p.indexOf(ds.pid); if(i>=0) f.p.splice(i,1); else f.p.push(ds.pid);
      index(); save(); const c = $('#bgbox'); if(c) c.innerHTML = bgHTML(); return;
    }
  }
  if(sheetMode==='food' && ds.eprop){
    const f = editableFood(); if(!f) return;
    const i = f.p.indexOf(ds.eprop); if(i>=0) f.p.splice(i,1); else f.p.push(ds.eprop);
    b.setAttribute('aria-pressed', String(i<0)); index(); save(); return;
  }

  switch(ds.act){
    case 'prev': cur = addDays(cur,-1); render(); break;
    case 'next': if(cur<todayKey()){ cur = addDays(cur,1); render(); } break;
    case 'close': closeSheet(); render(); break;
    case 'save-entry': saveEntry(); break;
    case 'del-entry':
      if(delArmed===draft.id){ S.entries = S.entries.filter(x=>x.id!==draft.id); delArmed=null; save(); closeSheet(); render(); toast('Eintrag gelöscht'); }
      else { delArmed = draft.id; b.classList.add('armed'); b.textContent='Wirklich löschen?'; setTimeout(()=>{ if(delArmed){ delArmed=null; if(b.isConnected){ b.classList.remove('armed'); b.textContent='Löschen'; } } },4000); }
      break;
    case 'resume-draft': { const st = getStash(); if(st){ cur = dayKey(st.t||Date.now()); render(); openSheet(st.type, st.id, st); } break; }
    case 'discard-draft': clearStash(); render(); break;
    case 'foods': fmQuery=''; openFoods(); break;
    case 'food-back': openFoods(); render(); break;
    case 'food-new': {
      const name = fmQuery.trim() || 'Neues Lebensmittel';
      const id = 'u'+uid();
      ensureCustomFoods().push({id, name, al:[name.toLowerCase()], p:[], custom:true});
      index(); save(); openFoodEdit(id);
      const inp = $('#fname'); if(inp){ inp.focus(); inp.select(); }
      break;
    }
    case 'food-del':
      if(foodDelArmed){ S.meta.foods = ensureCustomFoods().filter(x=>x.id!==editFoodId); foodDelArmed=false; index(); save(); openFoods(); render(); toast('Lebensmittel gelöscht'); }
      else { foodDelArmed = true; b.classList.add('armed'); b.textContent='Wirklich löschen?'; setTimeout(()=>{ foodDelArmed=false; if(b.isConnected){ b.classList.remove('armed'); b.textContent='Löschen'; } },4000); }
      break;
    case 'fc-all': fcAll = !fcAll; render(); break;
    case 'copy-summary': { const ok = await copyText(summaryText(), null); if(ok) toast('Zusammenfassung kopiert'); else { const pre=$('#summary'); const r=document.createRange(); r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Text markiert – jetzt kopieren'); } break; }
    case 'export': {
      const data = {app:'Darmtagebuch', exported:new Date().toISOString(), v:1, entries:S.entries, days:S.days, win:S.meta.win||3};
      if(S.meta.foods) data.foods = S.meta.foods;
      const ok = await copyText(JSON.stringify(data), $('#exportbox'));
      S.meta.lastBackup = Date.now(); save();
      if(ok){ toast('Sicherung kopiert – jetzt in eine Notiz einfügen'); render(); }
      else toast('Text markiert – jetzt kopieren');
      break;
    }
    case 'import': doImport(); break;
    case 'wipe':
      if(wipeArmed){ S = {v:1, entries:[], days:{}, meta:{hintDone:true}}; wipeArmed=false; save(); cur=todayKey(); render(); toast('Alle Daten gelöscht'); }
      else { wipeArmed = true; b.classList.add('armed'); b.textContent='Wirklich alles löschen?'; setTimeout(()=>{ wipeArmed=false; if(b.isConnected){ b.classList.remove('armed'); b.textContent='Alle Daten löschen'; } },4000); }
      break;
  }
});
['input','change','blur'].forEach(t=>document.addEventListener(t, ev=>{ if(sheetMode==='entry' && draft && ev.target.closest && ev.target.closest('.sheet')) stashDraft(); }, true));
let noteT, foodT;
document.addEventListener('input', ev=>{
  const id = ev.target.id;
  if(id==='daynote'){ const d = S.days[cur] = S.days[cur]||{}; d.note = ev.target.value; clearTimeout(noteT); noteT = setTimeout(save, 400); }
  else if(id==='foodq'){ foodQuery = ev.target.value; const g = $('#foodgrid'); if(g) g.innerHTML = gridHTML(); }
  else if(id==='fmq'){ fmQuery = ev.target.value; const l = $('#fmlist'); if(l) l.innerHTML = foodsListHTML(); }
  else if(id==='fname' || id==='falias'){
    const f = editableFood(); if(!f) return;
    if(id==='fname'){ const v = ev.target.value.trim(); if(v) f.name = v; }
    else f.al = ev.target.value.split(',').map(s=>s.trim().toLowerCase()).filter(Boolean);
    index(); clearTimeout(foodT); foodT = setTimeout(save, 500);
  }
});
document.addEventListener('keydown', ev=>{
  if(ev.target && ev.target.id==='foodq' && ev.key==='Enter'){ ev.preventDefault(); addFromQuery(); return; }
  if(ev.key==='Escape' && sheetMode){ closeSheet(); render(); }
});
['pointerdown','mousedown'].forEach(t=>document.addEventListener(t, ev=>{
  const b = ev.target.closest && ev.target.closest('#foodgrid button, #selfoods button');
  if(b && document.activeElement && document.activeElement.id==='foodq') ev.preventDefault();
}));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ const t=todayKey(); if(cur>t) cur=t; if(!sheetMode) render(); } });

load();
render();
if(!STANDALONE) initSync();
})();
</script>
