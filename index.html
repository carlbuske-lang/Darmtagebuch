<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darmtagebuch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<script>window.DT_STANDALONE=true;</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Darmtagebuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: eine Handy-Spalte; oben die 24-Stunden-Leiste als Herzstück, große Aktionen am Daumen, schwebende Tab-Leiste */
:root{
  --bg:#F1F3F7; --surface:#FFFFFF; --sunk:#E9ECF2; --ink:#101522; --muted:#5A6375; --line:#E0E4EC;
  --accent:#4338CA; --accent-ink:#FFFFFF; --accent-soft:#E8E7FC;
  --glass:rgba(255,255,255,.82);
  --b-hard:#3767B0; --b-ok:#23905A; --b-soft:#C08A10; --b-liquid:#C9433A; --gas:#1C7F91;
  --warn-soft:#FBE4E1; --warn-ink:#A3302A; --good-soft:#DDF3E6; --good-ink:#1C7448;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; --shadow:0 1px 2px rgba(16,21,34,.05), 0 8px 24px rgba(16,21,34,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151A22; --sunk:#1F2631; --ink:#E9EDF3; --muted:#9AA4B3; --line:#28303C;
  --accent:#9D9EFB; --accent-ink:#15133A; --accent-soft:#262551;
  --glass:rgba(21,26,34,.82);
  --b-hard:#7FA6E6; --b-ok:#56C188; --b-soft:#E3B24D; --b-liquid:#F17C70; --gas:#5CC3D3;
  --warn-soft:#3D1F1D; --warn-ink:#F4A39A; --good-soft:#163323; --good-ink:#86DBAA;
  --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A22; --sunk:#1F2631; --ink:#E9EDF3; --muted:#9AA4B3; --line:#28303C;
  --accent:#9D9EFB; --accent-ink:#15133A; --accent-soft:#262551;
  --glass:rgba(21,26,34,.82);
  --b-hard:#7FA6E6; --b-ok:#56C188; --b-soft:#E3B24D; --b-liquid:#F17C70; --gas:#5CC3D3;
  --warn-soft:#3D1F1D; --warn-ink:#F4A39A; --good-soft:#163323; --good-ink:#86DBAA;
  --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(112px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:2.1rem;line-height:1.02;font-weight:800}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-size:.84rem;font-weight:600;color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.note{font-size:.86rem;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card.flat{background:var(--sunk);box-shadow:none}

/* Kopf */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 16px}
.top > div:first-child{min-width:0}
.pillnav{display:flex;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:3px;flex:none}
.pillnav button{width:44px;height:40px;border:0;background:none;border-radius:999px;font-size:1.35rem;line-height:1}
.pillnav button:disabled{opacity:.28;cursor:default}

/* Tagesübersicht */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi b{display:block;font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:600}
.strip{position:relative;height:50px;margin:20px 10px 0}
.strip .track{position:absolute;left:0;right:0;top:21px;height:6px;border-radius:3px;background:var(--sunk)}
.strip .tick{position:absolute;top:36px;font-size:.68rem;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums;font-weight:600}
.strip .now{position:absolute;top:11px;width:2px;height:26px;margin-left:-1px;background:var(--accent);border-radius:1px}
.strip i{position:absolute;display:block}
.strip .m{top:15px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--ink)}
.strip .s{top:16px;width:16px;height:16px;margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2px var(--surface)}
.strip .p{top:1px;width:11px;height:11px;margin-left:-5.5px;transform:rotate(45deg);border-radius:2px;background:var(--b-liquid)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted);margin-top:8px;font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.legend .lg-m{background:transparent;border:2px solid var(--ink)}
.legend .lg-p{border-radius:2px;transform:rotate(45deg) scale(.85);background:var(--b-liquid)}
.legend .lg-sq{border-radius:3px}

/* Schnell-Erfassung */
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{min-height:68px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;font-weight:700;font-size:.95rem;padding:10px 12px;text-align:left;line-height:1.2;min-width:0}
.quick .ic{flex:none}
.strip .g{top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--gas)}
.legend .lg-g{background:var(--gas)}
.legend i.t{margin-right:2px}
.f-gas{fill:var(--gas)}
.badge.gas{background:var(--gas)}
.badge.gas svg{width:16px;height:16px}
.quick .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.quick svg{width:22px;height:22px}

/* Einträge */
.timeline{list-style:none;margin:0;padding:0}
.timeline li + li .entry{border-top:1px solid var(--line)}
.entry{width:100%;display:grid;grid-template-columns:44px 30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:none;border:0;padding:11px 0}
.entry .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;font-weight:600}
.badge{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:.82rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.badge.meal{background:var(--sunk);color:var(--ink)}
.badge.meal svg{width:16px;height:16px}
.entry .what{min-width:0}
.entry .what b{display:block;font-weight:700;overflow-wrap:anywhere}
.entry .what small{display:block;color:var(--muted);font-size:.84rem;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:2px 0}

.c-hard{background:var(--b-hard)} .c-ok{background:var(--b-ok)} .c-soft{background:var(--b-soft)} .c-liquid{background:var(--b-liquid)} .c-pain{background:var(--b-liquid)}

/* Zähler */
.counter{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 0}
.counter + .counter{border-top:1px solid var(--line)}
.counter .name b{display:block;font-weight:700}
.counter .name small{color:var(--muted);font-size:.82rem}
.stepper{display:flex;align-items:center;border-radius:14px;overflow:hidden;background:var(--sunk)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:1.35rem;line-height:1;font-weight:600}
.stepper output{min-width:34px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}

/* Chips und Felder */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem;font-weight:600;display:inline-flex;align-items:center}
.chip[aria-pressed="true"],.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}
.chip .x{margin-left:7px;font-size:1.05rem;line-height:1;opacity:.85}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale .chip{padding:0;min-height:42px;border-radius:12px;justify-content:center;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;background:var(--sunk);border-radius:14px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:11px;font-weight:700;font-size:.88rem;color:var(--muted);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.field{display:flex;flex-direction:column;gap:7px}
.field + .field{margin-top:16px}
textarea,input[type=text],input[type=search],input[type=datetime-local]{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--sunk);padding:11px 13px;min-height:46px}
textarea{min-height:76px;resize:vertical}

/* Bristol */
.bristol{display:flex;flex-direction:column;gap:6px}
.bristol button{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;min-height:48px}
.bristol button .n{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.bristol button small{color:var(--muted);font-size:.8rem}
.bristol button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

/* Lebensmittel */
.foodgrid{display:flex;flex-wrap:wrap;gap:6px;max-height:232px;overflow:auto;padding:2px 0}
.bgbox{background:var(--accent-soft);border-radius:16px;padding:13px 14px}
.bgbox ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.bgbox li{font-size:.92rem;line-height:1.35}
.bgbox li small{display:block;color:var(--muted);font-size:.82rem}
.bgbox .field{margin-top:12px}
.ptag{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin:3px 4px 0 0;white-space:nowrap}
.flist{list-style:none;margin:0;padding:0}
.flist li + li{border-top:1px solid var(--line)}
.frow{width:100%;background:none;border:0;text-align:left;padding:11px 0;display:flex;flex-direction:column;gap:2px}
.frow .nm{font-weight:700}

/* Buttons */
.btn{min-height:48px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--b-liquid);border-color:var(--b-liquid);background:transparent}
.btn.danger.armed{background:var(--b-liquid);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 120px}
.icon-btn{width:42px;height:42px;border-radius:13px;border:0;background:var(--sunk);display:grid;place-items:center;font-size:1.3rem;line-height:1;flex:none}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabs .inner{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:24px;box-shadow:0 10px 30px rgba(16,21,34,.14);padding:5px}
.tabs button{border:0;background:none;min-height:54px;border-radius:19px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);font-weight:700}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(6,9,16,.48);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;max-height:calc(100% - 64px);overflow:auto;-webkit-overflow-scrolling:touch;padding-block:6px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -12px 40px rgba(0,0,0,.22)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;position:sticky;top:-6px;z-index:2;background:var(--bg);padding-block:10px}
.sheet-head h2{flex:1;min-width:0;font-size:1.3rem}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:12px;margin-top:18px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
.err{color:var(--b-liquid);font-weight:700;font-size:.9rem;margin-top:10px}
.info-p + .info-p{margin-top:12px}
.info-p p{margin-top:3px;font-size:.94rem}

/* Verlauf */
.days{list-style:none;margin:0;padding:0}
.days li + li{border-top:1px solid var(--line)}
.dayrow{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.dayrow .d{font-weight:700}
.dayrow .dnote{grid-column:1 / -1;font-size:.85rem;color:var(--ink);font-style:italic;overflow-wrap:anywhere}
.dayrow .meta{grid-column:1 / -1;color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:3px 12px}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.pips i{width:11px;height:11px;border-radius:50%;display:block}

/* Auswertung */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.f-ok{fill:var(--b-ok)} .f-loose{fill:var(--b-soft)} .f-liquid{fill:var(--b-liquid)} .f-acc{fill:var(--accent)} .f-none{fill:var(--line)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.9rem}
.cmp .bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-bottom:6px}
.cmp .bar span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.cmp .bar.b span{background:var(--muted)}
.cmp b{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2.2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.fc{list-style:none;margin:6px 0 0;padding:0}
.fc li + li{border-top:1px solid var(--line)}
.fcrow{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;align-items:center}
.fcrow .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.pill{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.pill.good{background:var(--good-soft);color:var(--good-ink)}
.fch{margin:16px 0 0;font-size:.95rem}
.row.wrap{flex-wrap:wrap}
/* Auswertung v3 */
.atabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:16px;padding:4px;box-shadow:var(--shadow);margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.atabs button{border:0;background:none;border-radius:12px;min-height:42px;font-weight:700;font-size:.86rem;color:var(--muted)}
.atabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.qcard h2{font-size:1.25rem}
.answer p{font-size:1.02rem;margin-top:6px;line-height:1.4}
.answer small{display:block;margin-top:6px;color:var(--muted);font-size:.84rem}
.fmeta{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:.76rem}
.fmeta .ptag{margin:0}
.evp{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.evp.stark{background:var(--b-liquid);color:#fff}
.evp.mittel{background:var(--warn-soft);color:var(--warn-ink)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 0;min-height:36px}
.prog{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.prog.small{height:6px;margin-top:6px}
.gbt{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 16px;align-items:center;margin-top:10px;font-size:.9rem}
.gbh{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;text-align:right}
.gbh.good{color:var(--good-ink)} .gbh.bad{color:var(--warn-ink)}
.gbl{min-width:0}
.gbv{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.gbv.em{font-weight:800;color:var(--warn-ink)}
.explist{list-style:none;margin:0;padding:0}
.exprow{padding:10px 0}
.exprow + .exprow{border-top:1px solid var(--line)}
.expres{display:flex;flex-direction:column;gap:2px;font-size:.9rem;margin-top:6px}
.chart .mdot{fill:var(--accent);opacity:.6}
.cal u{position:absolute;left:25%;right:25%;bottom:3px;height:2px;border-radius:1px;background:var(--accent);text-decoration:none}
.banner.exp{background:var(--good-soft)}
.banner.exp p{color:var(--good-ink)}
.scale.s5{grid-template-columns:repeat(5,1fr)}
.chip.sus[aria-pressed="true"]{background:var(--b-liquid);border-color:var(--b-liquid);color:#fff}
.badge.meal.sus{box-shadow:inset 0 0 0 2px var(--b-liquid)}
.kfd.na{background:transparent;border:2px dashed var(--line)}
/* Kernaussagen */
.kf{list-style:none;margin:0;padding:0}
.kf li + li{border-top:1px solid var(--line)}
.kfrow{width:100%;background:none;border:0;text-align:left;padding:11px 0;display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;align-items:start;font-size:.95rem;line-height:1.4}
.kfrow small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.kfd{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--muted)}
.kfd.hi{background:var(--b-liquid)} .kfd.up{background:var(--b-soft)} .kfd.down{background:var(--b-ok)}
/* Einfluss-Diagramm */
.flist2{list-style:none;margin:8px 0 0;padding:0}
.flist2 li + li{border-top:1px solid var(--line)}

.fmid{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line)}
.fci{position:absolute;top:5px;height:6px;border-radius:3px;background:var(--muted);opacity:.45}
.fpt{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 2px var(--surface)}
.fci.hi,.fpt.hi{background:var(--b-liquid)} .fci.up,.fpt.up{background:var(--b-soft)} .fci.down,.fpt.down{background:var(--b-ok)}
.faxis{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);font-weight:600;margin:4px 0 0;font-variant-numeric:tabular-nums}
.fends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:2px}

.fhero.down{background:var(--good-soft)} .fhero.down p,.fhero.down .label{color:var(--good-ink)}
.chart .sdot{fill:var(--accent);opacity:.55}

.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font-size:.7rem;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal,.cal-e{aspect-ratio:1;border-radius:9px;max-width:100%}
.cal{border:0;position:relative;font-size:.74rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;display:grid;place-items:center}
.cal span{line-height:1}
.cal b{position:absolute;right:4px;bottom:2px;font-size:.6rem;font-weight:800;opacity:.75}
.cal i{position:absolute;left:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal.cn{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.cal.c0,.lg-sq.cl0{background:var(--good-soft)}
.cal.c1,.lg-sq.cl1{background:var(--sunk)}
.cal.c2,.lg-sq.cl2{background:var(--warn-soft)}
.cal.c3,.lg-sq.cl3{background:var(--b-liquid)}

.cal.today{box-shadow:inset 0 0 0 2px var(--accent)}

.dtb{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px 10px;align-items:center}
.dtl{font-weight:700;font-size:.9rem;line-height:1.2}

.method summary{cursor:pointer;list-style:none}

.dfc.na{background:transparent;border:1px dashed var(--line)}
.dfc.up{background:var(--warn-soft)} .dfc.up .dfv,.dfc.up .dfv b,.dfc.up .dft{color:var(--warn-ink)}

.heat{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1fr) repeat(3,60px);gap:4px;align-items:center;font-size:.76rem;font-weight:600;color:var(--muted)}
.heat.h3{grid-template-columns:repeat(3,1fr)}
.heat .hh{text-align:center;font-size:.7rem}
.heat .hl{min-width:0}
.heat .hc{height:28px;border-radius:8px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:700;background:var(--sunk);color:var(--muted)}

.heat .hc.up{background:var(--warn-soft);color:var(--warn-ink)}
.heat .hc.down{background:var(--good-soft);color:var(--good-ink)}
.heat .hc.na{background:transparent;border:1px dashed var(--line)}
.withnote{grid-column:1 / -1;font-size:.8rem;color:var(--muted)}
.sus{list-style:none;margin:0;padding:0}
.sus li + li{border-top:1px solid var(--line)}
.susrow{width:100%;background:none;border:0;text-align:left;padding:11px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:center}
.susrow .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.susrow .sub{grid-column:1 / -1;font-size:.84rem;color:var(--muted)}
.chart .ln-s{fill:none;stroke:var(--b-liquid);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln-g{fill:none;stroke:var(--gas);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}

.mline{grid-column:1 / -1;display:grid;grid-template-columns:116px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:600}
.mline .bar{position:relative;height:8px;border-radius:4px;background:var(--sunk)}
.mline .bar span{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--muted)}

.mline .bar i{position:absolute;top:-3px;width:2px;height:14px;margin-left:-1px;background:var(--ink);border-radius:1px}
.mline b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

.duo{grid-column:1 / -1;display:grid;grid-template-columns:36px minmax(0,1fr) 46px;gap:5px 8px;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.duo .bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}

.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

pre.summary{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:14px;padding:12px;font-size:.86rem;margin:0;font-family:var(--f-body);max-height:320px;overflow:auto}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){
  .sheet:not([hidden]){animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); if(d && Array.isArray(d.entries)) S = {v:1, entries:d.entries, days:d.days||{}, meta:d.meta||{}}; }
  }catch(e){ storageOK = false; }
}
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }catch(e){ storageOK = false; } }

try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = ms => { const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const keyDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = keyDate(k); d.setDate(d.getDate()+n); return dayKey(d.getTime()); };
const todayKey = () => dayKey(Date.now());
const fmtDate = k => keyDate(k).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDayLong = k => keyDate(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});

const fmtTime = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const num = (x,d=1) => (x==null || isNaN(x)) ? '–' : Number(x).toLocaleString('de-DE',{maximumFractionDigits:d});

  fett:{name:'Fettreich', short:'Starker Auslöser für Galle und Darmreflex', info:'Fett löst die stärkste Gallenausschüttung und einen kräftigen Darmreflex nach dem Essen aus. Bei Gallensäureverlust ist es der wichtigste Auslöser. Typisch sind Krämpfe und weicher, flockiger Stuhl innerhalb von ein bis drei Stunden.'},
  histamin:{name:'Histamin', short:'Rohwurst, Speck, gereifter Käse, Aufgewärmtes', info:'Histamin steckt in Rohwurst wie Salami, in Speck, gereiftem Käse und in Gerichten, die lange geschmort oder aufgewärmt wurden. Tomaten setzen zusätzlich Histamin im Körper frei. Bei einer Unverträglichkeit kommen Krämpfe und Durchfall oft schon innerhalb einer Stunde, manchmal mit Hautrötung oder Kopfschmerz.'},

  blaehend:{name:'Blähend', short:'Kohlgemüse, Hülsenfrüchte', info:'Kohlgemüse wie Brokkoli und Blumenkohl sowie Hülsenfrüchte bilden im Darm viel Gas. Typisch sind eher Druck und Blähungen als Durchfall.'},

  koffein:{name:'Koffein', short:'Regt den Dickdarm an', info:'Koffein regt den Dickdarm innerhalb von Minuten an. Kaffee zählst du auf der Tagesseite, hier geht es um Cola und Co.'},

let FMAP = new Map();
const matchCache = new Map();
function foodsList(){ return S.meta.foods || DEFAULT_FOODS; }
function ensureCustomFoods(){ if(!S.meta.foods) S.meta.foods = clone(DEFAULT_FOODS); return S.meta.foods; }
function matchText(text){
  if(!text) return [];
  const key = text.toLowerCase();
  if(matchCache.has(key)) return matchCache.get(key);
  const t = ' '+key+' ';
  const out = [];
  for(const f of foodsList()){
    const names = [f.name.toLowerCase(), ...(f.al||[])];
    if(names.some(a=>a && t.includes(a))) out.push(f.id);
  }
  matchCache.set(key, out);
  return out;
}
function mealFoods(e){
  const ids = new Set((e.foods||[]).filter(id=>FMAP.has(id)));
  matchText(e.text).forEach(id=>ids.add(id));
  return [...ids];
}
function mealProps(e){
  const p = new Set();
  mealFoods(e).forEach(id=>{ const f = FMAP.get(id); if(f) f.p.forEach(x=>p.add(x)); });
  (e.flags||[]).forEach(id=>{ const fl = FLAGS.find(x=>x.id===id); if(fl) fl.props.forEach(x=>p.add(x)); });
  (e.tags||[]).forEach(t=>(OLD_TAGS[t]||[]).forEach(x=>p.add(x)));
  return p;
}
function mealItems(e){ return [...mealFoods(e).map(id=>'f:'+id), ...[...mealProps(e)].map(p=>'p:'+p)]; }
function itemName(it){ const id = it.slice(2); if(it[0]==='f'){ const f = FMAP.get(id); return f ? f.name : 'Gelöschtes Lebensmittel'; } return PROP_CHECK[id] || (PROPS[id] ? PROPS[id].name : id); }

/* ---------- Synchronisierung mit dem Claude-Konto ---------- */
let COL = null, synced = false, lastSent = {}, writing = false, wTimer = null, syncState = STANDALONE ? 'device' : 'init', errShown = false;
const SYNC_TEXT = {
  init:'Verbinde mit deinem Claude-Konto …',
  ok:'Synchronisiert mit deinem Claude-Konto. PC und Handy zeigen dieselben Daten.',
  wait:'Dein Konto ist gerade nicht erreichbar. Neue Einträge bleiben auf diesem Gerät und werden übertragen, sobald die Verbindung steht.',
  err:'Synchronisieren hat nicht geklappt. Deine Einträge sind auf diesem Gerät gesichert. Lade die Seite später neu.',
  local:'Nur auf diesem Gerät gespeichert, weil keine Verbindung zum Claude-Konto besteht.',
  device:'Gespeichert nur auf diesem Handy, in dieser App. Mach ab und zu eine Sicherung und leg sie in einer Notiz ab.'
};
function setSync(st){
  syncState = st;
  const el = document.getElementById('syncstate'); if(el) el.textContent = SYNC_TEXT[st];
  if(st==='err' && !errShown){ errShown = true; toast('Synchronisieren fehlgeschlagen'); }
}
function payloads(){
  index();
  const out = {};
  const keys = new Set([...Object.keys(byDay), ...Object.keys(S.days), ...Object.keys(lastSent).filter(k=>k.startsWith('d-')).map(k=>k.slice(2))]);
  keys.forEach(k=>{
    const es = byDay[k] || []; const d = S.days[k] || {};
    const has = es.length || Object.keys(d).some(x=>d[x]!=null && d[x]!==0 && d[x]!=='');
    out['d-'+k] = has ? {entries:es, day:d} : null;
  });
  const m = {lastBackup:S.meta.lastBackup||0, hintDone:!!S.meta.hintDone, show:S.meta.show||{}, win:S.meta.win||3, fcm:S.meta.fcm||'bad', exps:S.meta.exps||[]};
  if(S.meta.foods) m.foods = S.meta.foods;
  out.meta = m;
  return out;
}
function queueSync(){ if(!COL || !synced) return; clearTimeout(wTimer); wTimer = setTimeout(flush, 600); }
async function flush(){
  wTimer = null;
  if(writing){ wTimer = setTimeout(flush, 400); return; }
  writing = true;
  try{
    const p = payloads();
    for(const [id, body] of Object.entries(p)){
      const js = body ? JSON.stringify(body) : null;
      if((lastSent[id] ?? null) === js) continue;
      if(body) await COL.doc(id).set(JSON.parse(js)); else await COL.doc(id).delete();
      if(js==null) delete lastSent[id]; else lastSent[id] = js;
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
  finally{ writing = false; }
}
function readRemote(snap){
  const r = {entries:[], days:{}, meta:null, sent:{}};
  snap.docs.forEach(doc=>{
    const d = doc.data(); if(!d) return;
    r.sent[doc.id] = JSON.stringify(d);
    if(doc.id==='meta') r.meta = clone(d);
    else if(doc.id.startsWith('d-')){
      (d.entries||[]).forEach(e=>r.entries.push(clone(e)));
      if(d.day && Object.keys(d.day).length) r.days[doc.id.slice(2)] = clone(d.day);
    }
  });
  return r;
}
function busyTyping(){ const a = document.activeElement; return !!(a && (a.id==='daynote' || a.id==='importbox')); }
function onRemote(snap){
  const r = readRemote(snap);
  if(!synced){
    const ids = new Set(r.entries.map(e=>e.id));
    const entries = r.entries.concat(S.entries.filter(e=>!ids.has(e.id)));
    const days = Object.assign({}, S.days);
    Object.entries(r.days).forEach(([k,v])=>{ days[k] = Object.assign({}, S.days[k]||{}, v); });
    const meta = Object.assign({}, S.meta, r.meta||{}, {show:Object.assign({}, S.meta.show||{}, (r.meta||{}).show||{})});
    if(!(r.meta && r.meta.foods) && S.meta.foods) meta.foods = S.meta.foods;
    S = {v:1, entries, days, meta};
    lastSent = r.sent; synced = true; setSync('ok');
    saveLocal(); queueSync();
    if(!busyTyping() && !sheetMode) render();
    return;
  }
  if(snap.metadata.hasPendingWrites || writing || wTimer) return;
  S = {v:1, entries:r.entries, days:r.days, meta:Object.assign({}, S.meta, r.meta||{})};
  lastSent = r.sent; saveLocal(); setSync('ok');
  if(!busyTyping() && !sheetMode) render();
}
async function initSync(){
  try{
    if(!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync('local'); return; }
    COL = db.collection('data/users/'+id);
    const t = setTimeout(()=>{ if(!synced) setSync('wait'); }, 10000);
    COL.onSnapshot(snap=>{
      if(snap.metadata.fromCache && !synced) return;
      clearTimeout(t); onRemote(snap);
    }, ()=>{ clearTimeout(t); setSync(synced?'err':'local'); });
  }catch(e){ setSync('local'); }
}

function defaultTime(){

let foodUsage = {}, foodQuery = '', newFoodIds = new Set();
function computeUsage(){ foodUsage = {}; S.entries.forEach(e=>{ if(e.type==='meal') mealFoods(e).forEach(id=>{ foodUsage[id] = (foodUsage[id]||0)+1; }); }); }
function sortedFoods(){ return foodsList().map((f,i)=>({f,i})).sort((a,b)=>(foodUsage[b.f.id]||0)-(foodUsage[a.f.id]||0) || a.i-b.i).map(x=>x.f); }

function openSheet(type, id, restored){
  index();
  const e = id ? S.entries.find(x=>x.id===id) : null;
  const st = restored || getStash();
  if(st && ((id && st.id===id) || (!id && !st.id && st.type===type))) draft = clone(st);
  else if(e) draft = clone(e);
  else {
    draft = {id:null, type, t:defaultTime(), note:''};
    if(type==='stool'){ draft.bristol=null; draft.urgent=false; draft.fatty=false; draft.burn=false; }
    if(type==='pain'){ draft.pain=null; draft.loc=[]; draft.kind=[]; }
    if(type==='gas'){ draft.amount=null; draft.sound=null; draft.smell=null; draft.extra=[]; }
  }
  if(draft.type==='meal'){
    if(!Array.isArray(draft.foods)) draft.foods = matchText(draft.text);
    if(!Array.isArray(draft.flags)) draft.flags = [];
    foodQuery = ''; newFoodIds = new Set(); computeUsage();
  }
  sheetMode = 'entry';
  showSheet(entrySheetHTML());
  stashDraft();
}

function saveEntry(){
  const sh = $('.sheet');

  if(draft.type==='meal') draft.text = sh.querySelector('#meal-text').value.trim();
  let msg = '';
  if(t==null) msg = 'Bitte einen gültigen Zeitpunkt wählen.';
  else if(draft.type==='stool' && !draft.bristol) msg = 'Bitte die Konsistenz wählen.';
  else if(draft.type==='pain' && !draft.pain) msg = 'Bitte die Stärke wählen.';
  else if(draft.type==='gas' && !draft.amount) msg = 'Bitte wählen, wie stark.';
  else if(draft.type==='meal' && !(draft.foods||[]).length && !draft.text && !(draft.flags||[]).length && !(draft.tags||[]).length) msg = 'Bitte mindestens ein Lebensmittel wählen oder kurz beschreiben, was es gab.';
  if(msg){ err.textContent = msg; err.hidden = false; err.scrollIntoView({block:'nearest'}); return; }
  draft.t = t;
  if(draft.type==='meal'){ if(draft.sus) draft.susFoods = (draft.susFoods||[]).filter(id=>(draft.foods||[]).includes(id)); else { delete draft.sus; delete draft.susFoods; } }
  const isNew = !draft.id;
  if(isNew){ draft.id = uid(); S.entries.push(draft); }
  else { const i = S.entries.findIndex(x=>x.id===draft.id); if(i>=0) S.entries[i] = draft; else S.entries.push(draft); }
  cur = dayKey(t);
  save(); closeSheet(); render();
  toast(isNew ? 'Gespeichert' : 'Änderung gespeichert');
}

/* ---------- Auswertung ---------- */
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }

/* ---------- Statistik ----------
   Beschwerden = Stuhlgänge ab Typ 5 (oder dringend) + Schmerz-Einträge.
   Effektmaß: Verhältnis beobachteter zu erwarteter Beschwerden (Ratenverhältnis)
   mit grobem 95-%-Bereich über die Poisson-Näherung. */
const LAGS = [{k:'a', l:'0–3 h', lo:0, hi:3}, {k:'b', l:'3–8 h', lo:3, hi:8}, {k:'c', l:'Folgetag', lo:8, hi:30}];
const isS = e => (e.type==='stool' && (e.bristol>=5 || e.urgent)) || e.type==='pain';
const isG = e => e.type==='gas';
const dayScore = d => dayBurden(d);
function rateRatio(O, E, So){
  const ratio = (O+0.5)/(E+0.5);
  const se = Math.sqrt(1/Math.max(O,0.5) + 1/Math.max(So,0.5));
  const l = Math.log(ratio);
  return {ratio, lo:Math.exp(l-1.96*se), hi:Math.exp(l+1.96*se)};
}
function effect(w, wo){
  if(w.length<3 || wo.length<3) return null;
  const mw = avg(w), mo = avg(wo);
  const O = w.reduce((a,b)=>a+b,0), So = wo.reduce((a,b)=>a+b,0);
  return Object.assign({nw:w.length, nwo:wo.length, mw, mo, hit:w.filter(x=>x>0).length}, rateRatio(O, w.length*mo, So));
}
function level(x){
  if(!x) return 'na';
  if(x.lo>1 && x.ratio>=1.4 && x.nw>=5 && x.nwo>=5) return 'hi';
  if(x.ratio>=1.4 && x.mw-x.mo>=0.2 && x.hit>=2) return 'up';
  if(x.hi<1 || (x.ratio<=0.7 && x.mo-x.mw>=0.2)) return 'down';
  return 'flat';
}
/* Mahlzeiten nur mit Mahlzeiten derselben Tageszeit vergleichen */
function effectStrat(rows, key, it){
  const groups = [[],[],[]]; rows.forEach(r=>groups[r.dp].push(r));
  let nw = 0, nwo = 0, O = 0, E = 0, So = 0, hit = 0;
  groups.forEach(g=>{
    const w = g.filter(r=>r.items.has(it)), o = g.filter(r=>!r.items.has(it));
    if(!w.length || !o.length) return;
    const mo = avg(o.map(r=>r[key]));
    nw += w.length; nwo += o.length;
    O += w.reduce((a,r)=>a+r[key],0); E += w.length*mo; So += o.reduce((a,r)=>a+r[key],0);
    hit += w.filter(r=>r[key]>0).length;
  });
  if(nw<3 || nwo<3) return null;
  return Object.assign({nw, nwo, mw:O/nw, mo:E/nw, hit}, rateRatio(O, E, So));
}
function mealAnalysis(tr){
  const now = Date.now();
  const trSet = new Set(tr.map(d=>d.k));
  const meals = S.entries.filter(e=>e.type==='meal' && trSet.has(dayKey(e.t)));
  const evS = S.entries.filter(isS), evG = S.entries.filter(isG);
  const cnt = (arr, t, lo, hi) => arr.filter(e=>e.t>t+lo*3600e3 && e.t<=t+hi*3600e3).length;
  const base = meals.map(m=>{
    const h = new Date(m.t).getHours();
    const r = {items:new Set(mealItems(m)), foods:new Set(mealFoods(m)), dp: h<11 ? 0 : (h<16 ? 1 : 2)};
    LAGS.forEach(L=>{
      const done = now-m.t >= L.hi*3600e3;
      const s = cnt(evS,m.t,L.lo,L.hi), g = cnt(evG,m.t,L.lo,L.hi);
      r['s'+L.k] = (done || s>0) ? s : null;
      r['g'+L.k] = (done || g>0) ? g : null;
    });
    return r;
  });
  const all = new Set(); base.forEach(r=>r.items.forEach(it=>all.add(it)));
  const out = [];
  all.forEach(it=>{
    const cells = {}; let any = false;
    ['s','g'].forEach(sym=>LAGS.forEach(L=>{
      const key = sym+L.k;
      const x = effectStrat(base.filter(r=>r[key]!=null), key, it);
      cells[key] = x; if(x) any = true;
    }));
    if(!any) return;
    let with_ = null;
    if(it[0]==='f'){
      const id = it.slice(2), mine = base.filter(r=>r.foods.has(id));
      const co = {};
      mine.forEach(r=>r.foods.forEach(o=>{ if(o!==id) co[o] = (co[o]||0)+1; }));
      Object.entries(co).forEach(([o,c])=>{ const tot = base.filter(r=>r.foods.has(o)).length; if(!with_ && c/mine.length>=0.8 && c/tot>=0.8) with_ = o; });
    }
    out.push({it, n:base.filter(r=>r.items.has(it)).length, cells, with_});
  });
  return {rows:out, meals:base.length, base};
}
function dayFactorsV2(tr){
  const all = {};
  const getS = k => all[k] || (all[k] = dayStats(k));
  const nxt = d => { const x = getS(addDays(d.k,1)); return (x.tracked && x.k<=todayKey()) ? x : null; };
  const med = f => { const v = tr.map(f); const m = median(v); return (m!=null && Math.max(...v)>Math.min(...v)) ? m : null; };
  const defs = [];
  const numeric = (id, key, word) => { const m = med(d=>d[key]); if(m==null){ defs.push({id, l:word, none:true}); return; } const t = Math.floor(m)+1; defs.push({id, l:`${t} oder mehr ${word}`, lb:`Tage mit höchstens ${t-1} ${word}`, f:d=>d[key]>=t, num:key, word}); };
  numeric('beer','beer','Bier'); numeric('cigs','cigs','Zigaretten'); numeric('coffee','coffee','Kaffee');
  defs.push({id:'stress', l:'Stress 6–10', lb:'Tage mit Stress 1–5', f:d=>d.stress>=6, only:d=>d.stress!=null, num:'stress', word:'Stress'});
  [['Büro','buero','Bürotag'],['Homeoffice','ho','Homeoffice'],['Frei','frei','Freier Tag'],['Reise','reise','Reisetag']].forEach(([v,id,l])=>defs.push({id, l, lb:'Tage mit anderer Tagesart', f:d=>d.dtype===v, only:d=>!!d.dtype}));
  return defs.map(def=>{
    if(def.none) return Object.assign({}, def, {nA:0, nB:0});
    const days = tr.filter(d=>!def.only || def.only(d));
    const A = days.filter(def.f), B = days.filter(d=>!def.f(d));
    const nA = A.map(nxt).filter(Boolean), nB = B.map(nxt).filter(Boolean);
    return Object.assign({}, def, {
      nA:A.length, nB:B.length, days,
      same: effect(A.map(dayScore), B.map(dayScore)),
      next: effect(nA.map(dayScore), nB.map(dayScore)),
      gsame: effect(A.map(d=>d.gas), B.map(d=>d.gas)),
      gnext: effect(nA.map(d=>d.gas), nB.map(d=>d.gas))
    });
  });
}
const RANK = {hi:4, up:3, down:2, flat:1, na:0};
function factorList(R, sym){
  const out = [];
  R.ma.rows.forEach(r=>{
    let best = null;
    LAGS.forEach(L=>{ const x = r.cells[sym+L.k]; if(!x) return; const sc = RANK[level(x)]*10 + Math.abs(Math.log(x.ratio)); if(!best || sc>best.sc) best = {x, L, sc}; });
    if(!best) return;
    out.push({key:r.it, cat:'essen', name:itemName(r.it), group:r.it[0]==='p', when:best.L.k==='c' ? 'am Folgetag' : best.L.l+' nach dem Essen', unit:'Mahlzeiten', x:best.x, lag:best.L, with_:r.with_, meal:r});
  });
  R.dayF.forEach(f=>{
    if(f.none) return;
    const c = sym==='s' ? [['same',f.same,'am selben Tag'],['next',f.next,'am Folgetag']] : [['same',f.gsame,'am selben Tag'],['next',f.gnext,'am Folgetag']];
    let best = null;
    c.forEach(([k,x,t])=>{ if(!x) return; const sc = RANK[level(x)]*10 + Math.abs(Math.log(x.ratio)); if(!best || sc>best.sc) best = {k, x, t, sc}; });
    if(!best) return;
    out.push({key:'d:'+f.id, cat:'alltag', name:f.l, when:best.t, whenK:best.k, unit:'Tage', x:best.x, day:f});
  });
  // Lebensmittel, deren Auffälligkeit verschwindet, wenn man ein anderes auffälliges Lebensmittel herausnimmt
  const meals = out.filter(f=>f.meal);
  meals.forEach(f=>{
    if(!['hi','up'].includes(level(f.x))) return;
    const key = sym+f.lag.k;
    const rows = R.ma.base.filter(r=>r[key]!=null);
    const okDp = [0,1,2].filter(dp=>rows.some(r=>r.dp===dp && r.items.has(f.key)) && rows.some(r=>r.dp===dp && !r.items.has(f.key)));
    const fRows = rows.filter(r=>r.items.has(f.key) && okDp.includes(r.dp));
    const others = meals.filter(g=>g!==f && ['hi','up'].includes(level(g.x)) && g.x.ratio>=f.x.ratio*0.8).sort((a,b)=>b.x.ratio-a.x.ratio);
    for(const g of others){
      const share = fRows.filter(r=>r.items.has(g.key)).length / Math.max(1,fRows.length);
      if(share<0.25 || share>=0.95) continue;
      const adj = effectStrat(rows.filter(r=>!r.items.has(g.key)), key, f.key);
      if(adj && ['flat','down'].includes(level(adj))){ f.only = g.name; break; }
    }
  });
  // Scheinbar gute Lebensmittel: nur besser, weil an diesen Mahlzeiten ein auffälliges Lebensmittel fehlte
  meals.forEach(f=>{
    if(level(f.x)!=='down') return;
    const key = sym+f.lag.k;
    const rows = R.ma.base.filter(r=>r[key]!=null);
    const bad = meals.filter(g=>g!==f && level(g.x)==='hi' && !g.only).sort((a,b)=>b.x.ratio-a.x.ratio);
    for(const g of bad){
      const adj = effectStrat(rows.filter(r=>!r.items.has(g.key)), key, f.key);
      if(adj && level(adj)==='flat'){ f.notWith = g.name; break; }
    }
  });
  const lvOf = f => (f.only || f.notWith) ? 'flat' : level(f.x);
  const score = f => { const lv = lvOf(f); return RANK[lv]*100 + (lv==='hi'||lv==='up' ? Math.log(f.x.lo)*10 + Math.log(f.x.ratio) : lv==='down' ? -Math.log(f.x.hi) : -Math.abs(Math.log(f.x.ratio))); };
  out.forEach(f=>{ f.lv = lvOf(f); });
  out.sort((a,b)=>score(b)-score(a));
  return out;
}

/* ---------- Analyse-Engine v3 ----------
   Drei Fragen, drei Modelle:
   1. Reflex:      Löst eine Mahlzeit innerhalb von 3 h Beschwerden aus?  (logistische Regression pro Mahlzeit)
   2. Tage:        Wie hoch ist die Beschwerdelast eines Tages?           (Poisson-Regression pro Tag)
   3. Blähungen:   Wie viele Blähungen hat ein Tag?                      (Poisson-Regression pro Tag)
   Alle Faktoren stehen gleichzeitig im Modell, damit Begleitfaktoren (Toast neben Salami, Bier am Freitag)
   sich gegenseitig herausrechnen. Ridge-Regularisierung zieht schwach belegte Effekte Richtung „kein Effekt“.
   Stabilität per Bootstrap über ganze Tage mit festem Zufallsstartwert: gleiche Daten, gleiches Ergebnis. */
const AMT_W = {1:0.5, 2:1, 3:1.5};
const stoolW = e => (e.bristol>=5 || e.urgent) ? (AMT_W[e.amt]||1) : 0;
const painW = e => (e.pain||0)>=7 ? 1.5 : 1;
const gasW = e => AMT_W[e.amount]||1;
const dayBurden = d => d.st.reduce((a,e)=>a+stoolW(e),0) + d.pa.reduce((a,e)=>a+painW(e),0);
const dayGasW = d => d.ga.reduce((a,e)=>a+gasW(e),0);

function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function solveSym(A, b){
  const n = b.length, L = A.map(r=>Float64Array.from(r));
  for(let j=0;j<n;j++){
    let s = L[j][j]; for(let k=0;k<j;k++) s -= L[j][k]*L[j][k];
    L[j][j] = Math.sqrt(Math.max(s,1e-10));
    for(let i=j+1;i<n;i++){ let t = L[i][j]; for(let k=0;k<j;k++) t -= L[i][k]*L[j][k]; L[i][j] = t/L[j][j]; }
  }
  const y = new Float64Array(n);
  for(let i=0;i<n;i++){ let t = b[i]; for(let k=0;k<i;k++) t -= L[i][k]*y[k]; y[i] = t/L[i][i]; }
  const x = new Float64Array(n);
  for(let i=n-1;i>=0;i--){ let t = y[i]; for(let k=i+1;k<n;k++) t -= L[k][i]*x[k]; x[i] = t/L[i][i]; }
  return x;
}
/* Ridge-GLM per IRLS. X: Zeilen mit p Merkmalen, cnt: Zeilengewichte (Bootstrap), fam: 'pois' | 'logit' */
function fitGLM(X, y, cnt, fam, lam, init){
  const lamv = Array.isArray(lam) ? lam : null;
  const n = X.length, p = n ? X[0].length : 0, q = p+1;
  let beta;
  if(init) beta = Float64Array.from(init);
  else {
    beta = new Float64Array(q);
    let sw = 0, sy = 0; for(let i=0;i<n;i++){ sw += cnt[i]; sy += cnt[i]*y[i]; }
    const m = sy/Math.max(sw,1e-9);
    beta[0] = fam==='pois' ? Math.log(Math.max(m,0.05)) : Math.log(Math.min(0.97,Math.max(0.03,m))/(1-Math.min(0.97,Math.max(0.03,m))));
  }
  for(let it=0; it<25; it++){
    const A = Array.from({length:q},()=>new Float64Array(q)), r = new Float64Array(q);
    for(let i=0;i<n;i++){
      const c = cnt[i]; if(!c) continue;
      const xi = X[i];
      let eta = beta[0]; for(let j=0;j<p;j++) if(xi[j]!==0) eta += beta[j+1]*xi[j];
      eta = Math.max(-15, Math.min(15, eta));
      let mu, W;
      if(fam==='pois'){ mu = Math.exp(eta); W = Math.max(mu,1e-6); } else { mu = 1/(1+Math.exp(-eta)); W = Math.max(mu*(1-mu),1e-6); }
      const z = eta + (y[i]-mu)/W, w = W*c;
      A[0][0] += w; r[0] += w*z;
      for(let j=0;j<p;j++){
        const xj = xi[j]; if(xj===0) continue;
        A[j+1][0] += w*xj; r[j+1] += w*xj*z;
        for(let k=0;k<=j;k++){ const xk = xi[k]; if(xk!==0) A[j+1][k+1] += w*xj*xk; }
      }
    }
    for(let j=1;j<q;j++) A[j][j] += lamv ? lamv[j-1] : lam;
    A[0][0] += 1e-6;
    const nb = solveSym(A, r);
    let d = 0; for(let j=0;j<q;j++) d = Math.max(d, Math.abs(nb[j]-beta[j]));
    beta = nb; if(d<1e-5) break;
  }
  return beta;
}
const LAM = 2.0, BOOT = 100;
/* Kennzahlen der Merkmale */
const NUMS = [
  {id:'n:beerPrev', label:'Bier am Vorabend', unit:'2 Bier mehr am Vorabend', per:2, get:d=>{ const p = dayStats(addDays(d.k,-1)); return p.tracked ? p.beer : null; }},
  {id:'n:coffee', label:'Kaffee', unit:'Tasse Kaffee mehr', per:1, get:d=>d.coffee},
  {id:'n:cigs', label:'Zigaretten', unit:'5 Zigaretten mehr', per:5, get:d=>d.cigs},
  {id:'n:stress', label:'Stress', unit:'2 Punkte mehr Stress', per:2, get:d=>d.stress},
  {id:'n:sleepH', label:'Schlafdauer', unit:'Stunde mehr Schlaf', per:1, get:d=>(S.days[d.k]||{}).sleepH ?? null},
  {id:'n:sleepQ', label:'Schlafqualität', unit:'Punkt besser', per:1, get:d=>(S.days[d.k]||{}).sleepQ ?? null}
];
const CTX = [
  {id:'c:buero', label:'Bürotag', f:d=>d.dtype==='Büro'},
  {id:'c:ho', label:'Homeoffice', f:d=>d.dtype==='Homeoffice'},
  {id:'c:frei', label:'Freier Tag', f:d=>d.dtype==='Frei'},
  {id:'c:reise', label:'Reisetag', f:d=>d.dtype==='Reise'}
];
function featName(id){
  const t = id.slice(0,2), k = id.slice(2);
  if(t==='f:') return (FMAP.get(k)||{name:'Gelöschtes Lebensmittel'}).name;
  if(t==='v:') return (FMAP.get(k)||{name:'?'}).name+' am Vorabend';
  if(t==='p:') return PROP_CHECK[k] || (PROPS[k]||{}).name || k;
  if(t==='q:') return (PROP_CHECK[k] || (PROPS[k]||{}).name || k)+' am Vorabend';

  if(t==='t:') return k==='mittag' ? 'Mittagessen' : 'Abendessen';
  if(t==='c:') return (CTX.find(x=>x.id===id)||{}).label || k;

function featCat(id){ const t = id.slice(0,2); return (t==='f:'||t==='v:'||t==='p:'||t==='q:'||t==='z:') ? 'essen' : (t==='t:' ? 'zeit' : 'alltag'); }

/* Daten für ein Modell aufbereiten */
function buildData(kind, variant, keys){
  const days = keys.map(dayStats).filter(d=>d.tracked);
  const dayIdx = new Map(days.map((d,i)=>[d.k,i]));
  const rows = [];   // {cl: Tag-Index, set: Set binärer Merkmale, num: {id: Wert}, y}
  const now = Date.now(), W3 = 3*3600e3;
  const dayNums = d => { const o = {}; NUMS.forEach(n=>{ const v = n.get(d); if(v!=null) o[n.id] = v; }); return o; };
  const ctxSet = (d, set) => CTX.forEach(c=>{ if(c.f(d)) set.add(c.id); });
  const mealSet = (m, set, pre) => {
    if(variant==='props'){ mealProps(m).forEach(p=>set.add((pre==='v'?'q:':'p:')+p)); }
    else {
      mealFoods(m).forEach(id=>set.add((pre==='v'?'v:':'f:')+id));
      if(pre!=='v') (m.flags||[]).forEach(z=>set.add('z:'+z));
    }
  };
  if(kind==='reflex'){
    const evs = S.entries.filter(e=>isS(e));
    days.forEach(d=>{
      d.me.forEach(m=>{
        const ev = evs.some(e=>e.t>m.t && e.t-m.t<=W3);
        if(!ev && now-m.t < W3) return;
        const set = new Set(); mealSet(m, set, '');
        const h = new Date(m.t).getHours();
        if(h>=11 && h<16) set.add('t:mittag'); else if(h>=16) set.add('t:abend');
        ctxSet(d, set);
        rows.push({cl:dayIdx.get(d.k), set, num:dayNums(d), y: ev?1:0});
      });
    });
  } else {
    days.forEach(d=>{
      if(d.k===todayKey()) return;
      const set = new Set();
      d.me.forEach(m=>mealSet(m, set, ''));
      const prev = dayStats(addDays(d.k,-1));
      prev.me.filter(m=>new Date(m.t).getHours()>=16).forEach(m=>mealSet(m, set, 'v'));
      ctxSet(d, set);
      rows.push({cl:dayIdx.get(d.k), set, num:dayNums(d), y: kind==='gas' ? dayGasW(d) : dayBurden(d)});
    });
  }
  // Merkmale auswählen: binär mindestens 3× vorhanden und 3× nicht, höchstens 36 häufigste
  const n = rows.length;
  const cnt = {}; rows.forEach(r=>r.set.forEach(id=>{ cnt[id] = (cnt[id]||0)+1; }));
  let bins = Object.keys(cnt).filter(id=>cnt[id]>=3 && n-cnt[id]>=3);
  bins.sort((a,b)=>(a.startsWith('t:')||a.startsWith('c:') ? -1 : 0) - (b.startsWith('t:')||b.startsWith('c:') ? -1 : 0) || cnt[b]-cnt[a]);
  const col = id => rows.map(r=>r.set.has(id)?1:0);
  const corr = (a, b) => { const ma = avg(a), mb = avg(b); let x=0, y=0, z=0; for(let i=0;i<a.length;i++){ x += (a[i]-ma)*(b[i]-mb); y += (a[i]-ma)**2; z += (b[i]-mb)**2; } return (y && z) ? x/Math.sqrt(y*z) : 0; };
  // Tagesart: häufigste als Referenz, die anderen werden damit verglichen
  const ctxIds = bins.filter(id=>id.startsWith('c:'));
  let ctxBase = null;
  if(ctxIds.length){ const allCtx = CTX.map(c=>c.id).filter(id=>cnt[id]); allCtx.sort((a,b)=>cnt[b]-cnt[a]); ctxBase = allCtx[0]; bins = bins.filter(id=>id!==ctxBase); }
  // Nicht trennbare Merkmale zusammenfassen
  const kept = [], alias = {}, inseparable = [];
  const bf = kind==='reflex' ? rows.map(r=>(!r.set.has('t:mittag') && !r.set.has('t:abend'))?1:0) : null;
  for(const id of bins){
    const v = col(id);
    if(bf && !id.startsWith('t:') && !id.startsWith('c:') && corr(v, bf)>=0.92){ inseparable.push(id); continue; }
    const twin = kept.find(k=>corr(col(k), v)>=0.92);
    if(twin){ (alias[twin] = alias[twin] || []).push(id); continue; }
    kept.push(id);
    if(kept.length>=36) break;
  }
  bins = kept;
  const nums = [];
  NUMS.forEach(nf=>{
    const vals = rows.map(r=>r.num[nf.id]).filter(v=>v!=null);
    if(vals.length<5) return;
    const m = avg(vals), sd = Math.sqrt(vals.reduce((a,v)=>a+(v-m)*(v-m),0)/Math.max(1,vals.length-1));
    if(sd<1e-6) return;
    nums.push({id:nf.id, m, sd, per:nf.per, unit:nf.unit});
  });
  const feats = [...bins.map(id=>({id, bin:true})), ...nums.map(x=>Object.assign({bin:false}, x))];
  const X = rows.map(r=>feats.map(f=>f.bin ? (r.set.has(f.id)?1:0) : (((r.num[f.id] ?? f.m) - f.m)/f.sd)));
  const y = rows.map(r=>r.y);
  return {rows, feats, X, y, nDays:days.length, cnt, alias, inseparable, ctxBase};
}

const MODEL_CACHE = new Map();
function dataSig(){ return S.entries.length+'|'+JSON.stringify(S.days).length+'|'+(S.meta.foods?JSON.stringify(S.meta.foods).length:0)+'|'+S.entries.reduce((a,e)=>a+(e.t%9973)+(e.bristol||0)+(e.pain||0)+(e.amt||0)+(e.amount||0)+((e.foods||[]).length),0); }
const NEED = {reflex:{units:20, ev:4, label:'Mahlzeiten'}, tage:{units:14, label:'Tage'}, gas:{units:14, ev:4, label:'Tage'}};
function runModel(kind, variant, n, noCross){
  const key = kind+'|'+variant+'|'+n+'|'+(noCross?'x':'')+'|'+todayKey()+'|'+dataSig();
  if(MODEL_CACHE.has(key)) return MODEL_CACHE.get(key);
  const keys = rangeKeys(n);
  const D = buildData(kind, variant, keys);
  const fam = kind==='reflex' ? 'logit' : 'pois';
  const need = NEED[kind];
  const events = kind==='reflex' ? D.y.filter(v=>v>0).length : D.y.filter(v=>v>0).length;
  const nonEv = D.y.length - events;
  const res = {kind, variant, n:D.y.length, need, events, feats:[], ready:false};
  res.base = avg(D.y) || 0;
  const enough = D.y.length>=need.units && (!need.ev || (events>=need.ev && (kind!=='reflex' || nonEv>=need.ev)));
  if(!enough || !D.feats.length){ MODEL_CACHE.set(key, res); return res; }
  res.ready = true;
  const ones = D.y.map(()=>1);
  const lamv = D.feats.map(f=>f.id.startsWith('t:') ? 0.01 : LAM);
  const full = fitGLM(D.X, D.y, ones, fam, lamv);
  // Bootstrap über Tage
  const cls = [...new Set(D.rows.map(r=>r.cl))];
  const rnd = mulberry32(20261116 + D.y.length*31 + D.feats.length);
  const boots = [];
  for(let b=0;b<BOOT;b++){
    const draw = {}; for(let i=0;i<cls.length;i++){ const c = cls[Math.floor(rnd()*cls.length)]; draw[c] = (draw[c]||0)+1; }
    const cnt = D.rows.map(r=>draw[r.cl]||0);
    boots.push(fitGLM(D.X, D.y, cnt, fam, lamv, full));
  }
  res.feats = D.feats.map((f,j)=>{
    const scale = f.bin ? 1 : (f.per/f.sd);
    const eff = Math.exp(full[j+1]*scale);
    const bs = boots.map(bb=>Math.exp(bb[j+1]*scale)).sort((a,b)=>a-b);
    const q = p => bs[Math.min(bs.length-1, Math.max(0, Math.round(p*(bs.length-1))))];
    const up = bs.filter(v=>v>1.1).length/bs.length, down = bs.filter(v=>v<1/1.1).length/bs.length;
    const dir = eff>=1 ? 'up' : 'down';
    const stab = dir==='up' ? up : down;
    const mag = Math.abs(Math.log(eff));
    let ev = (stab>=0.975 && mag>=Math.log(1.3)) ? 'stark' : (stab>=0.95 && mag>=Math.log(1.25)) ? 'mittel' : (stab>=0.85 && mag>=Math.log(1.15)) ? 'hinweis' : 'keins';
    // Rohvergleich für binäre Merkmale
    let raw = null;
    if(f.bin){ const w = [], o = []; D.rows.forEach((r,i)=>{ (r.set.has(f.id)?w:o).push(D.y[i]); }); raw = {nw:w.length, no:o.length, mw:avg(w), mo:avg(o), hits:w.filter(v=>v>0).length}; }
    // Mindestbelege: ein verstärkender Faktor braucht mindestens 3 Fälle mit Beschwerden, ein schützender mindestens 8 Fälle
    if(raw && (ev==='stark' || ev==='mittel')){ if(dir==='up' && raw.hits<3) ev = 'hinweis'; if(dir==='down' && raw.nw<8) ev = 'hinweis'; }
    if(f.id.startsWith('t:') && ev!=='keins') ev = 'hinweis';
    let name = featName(f.id);
    if(D.alias[f.id]) name = [name, ...D.alias[f.id].map(featName)].join(' + ');
    if(f.id.startsWith('c:') && D.ctxBase) name += ` statt ${featName(D.ctxBase)}`;
    return {id:f.id, bin:f.bin, unit:f.unit, name, cat:featCat(f.id), eff, lo:q(0.1), hi:q(0.9), stab, dir, ev, raw, count:f.bin ? D.cnt[f.id] : null, j};
  });
  // Gegenstücke: zwei auffällige Merkmale, die sich fast ausschließen und gegensätzlich wirken, erklären meist dasselbe
  const colOf = j => D.X.map(r=>r[j]);
  const corrJ = (a, b) => { const x = colOf(a), y = colOf(b), mx = avg(x), my = avg(y); let s1=0, s2=0, s3=0; for(let i=0;i<x.length;i++){ s1 += (x[i]-mx)*(y[i]-my); s2 += (x[i]-mx)**2; s3 += (y[i]-my)**2; } return (s2 && s3) ? s1/Math.sqrt(s2*s3) : 0; };
  const sig = res.feats.filter(f=>f.ev==='stark' || f.ev==='mittel');
  const strength = f => Math.abs(Math.log(f.eff))*f.stab;
  const dpOf = r => r.set.has('t:mittag') ? 1 : r.set.has('t:abend') ? 2 : 0;
  const corrStrat = (a, b) => {
    if(kind!=='reflex') return corrJ(a.j, b.j);
    const fa = D.rows.map((r,i)=>i).filter(i=>D.X[i][a.j]===1);
    if(!fa.length) return 0;
    const dps = fa.map(i=>dpOf(D.rows[i])); const dp = [0,1,2].sort((x,y)=>dps.filter(v=>v===y).length-dps.filter(v=>v===x).length)[0];
    const idx = D.rows.map((r,i)=>i).filter(i=>dpOf(D.rows[i])===dp);
    const x = idx.map(i=>D.X[i][a.j]), y = idx.map(i=>D.X[i][b.j]), mx = avg(x), my = avg(y);
    let s1=0, s2=0, s3=0; for(let i=0;i<x.length;i++){ s1 += (x[i]-mx)*(y[i]-my); s2 += (x[i]-mx)**2; s3 += (y[i]-my)**2; }
    return (s2 && s3) ? s1/Math.sqrt(s2*s3) : 0;
  };
  sig.forEach(a=>sig.forEach(b=>{
    if(a===b || a.dir===b.dir || a.mirror || b.mirror || !a.bin || !b.bin) return;
    if(Math.min(corrStrat(a,b), corrStrat(b,a)) <= -0.5){ const weak = a.dir==='down' ? a : b, strong = weak===a ? b : a; weak.mirror = strong.name; weak.ev = 'hinweis'; }
  }));
  // Robustheit: Faktoren, die in beiden Modellvarianten vorkommen (Alltag, Tageszeit), müssen in beiden in dieselbe Richtung zeigen
  if(!noCross){
    const other = runModel(kind, variant==='props' ? 'foods' : 'props', n, true);
    if(other.ready) res.feats.forEach(f=>{
      if(f.ev!=='stark' && f.ev!=='mittel') return;
      const o = other.feats.find(x=>x.id===f.id); if(!o) return;
      if(o.dir!==f.dir || (o.ev!=='stark' && o.ev!=='mittel')) f.ev = 'hinweis';
    });
  }
  res.inseparable = D.inseparable.map(featName);
  res.ctxBase = D.ctxBase ? featName(D.ctxBase) : null;
  res.feats.sort((a,b)=>Math.abs(Math.log(b.eff))*(b.stab) - Math.abs(Math.log(a.eff))*(a.stab));
  MODEL_CACHE.set(key, res);
  return res;
}
/* Effekt in Worte fassen */
function effPct(e){ const p = Math.round((e-1)*100); return (p>0?'+':'−')+Math.abs(p)+' %'; }
function riskWith(base, or){ return base*or/(1-base+base*or); }
function featSentence(M, f){
  if(M.kind==='reflex'){
    const p0 = M.base, p1 = riskWith(p0, f.eff);
    if(f.bin) return `Reflex nach dem Essen in ${Math.round(p1*100)} % statt ${Math.round(p0*100)} % der Mahlzeiten`;
    return `je ${f.unit}: Reflex-Risiko ${Math.round(p0*100)} % → ${Math.round(p1*100)} %`;
  }
  const what = M.kind==='gas' ? 'Blähungen' : 'Beschwerden';
  if(f.bin) return `${effPct(f.eff)} ${what} am Tag (${num(M.base*f.eff)} statt ${num(M.base)})`;
  return `je ${f.unit}: ${effPct(f.eff)} ${what}`;
}

function analyze(n){
  const keys = rangeKeys(n);
  const ds = keys.map(dayStats);
  const tr = ds.filter(d=>d.tracked);
  const all = {};
  const getS = k => all[k] || (all[k] = dayStats(k));
  const R = {keys, ds, tr, insights:[], pending:[]};
  if(!tr.length) return R;

  const stools = tr.flatMap(d=>d.st);
  R.avgStool = avg(tr.map(d=>d.stool));
  R.minStool = Math.min(...tr.map(d=>d.stool)); R.maxStool = Math.max(...tr.map(d=>d.stool));
  R.avgB = avg(stools.map(e=>e.bristol).filter(Boolean));
  R.loosePct = stools.length ? stools.filter(e=>e.bristol>=6).length/stools.length : null;
  R.urgentPct = stools.length ? stools.filter(e=>e.urgent).length/stools.length : null;
  R.fattyPct = stools.length ? stools.filter(e=>e.fatty).length/stools.length : null;
  R.burnPct = stools.length ? stools.filter(e=>e.burn).length/stools.length : null;
  const pains = tr.flatMap(d=>d.pa);
  R.painCount = pains.length; R.painAvg = avg(pains.map(e=>e.pain||0));
  const gases = tr.flatMap(d=>d.ga);
  R.gasCount = gases.length; R.gasDay = avg(tr.map(d=>d.gas));
  R.gasSmellPct = gases.length ? gases.filter(g=>g.smell===3).length/gases.length : null;
  R.gasLoudPct = gases.length ? gases.filter(g=>g.sound===2).length/gases.length : null;
  const locs = {}; pains.forEach(p=>(p.loc||[]).forEach(l=>{ locs[l]=(locs[l]||0)+1; }));
  R.painLocs = Object.entries(locs).sort((a,b)=>b[1]-a[1]);
  ['beer','cigs','coffee','lop','chol'].forEach(k=>{ R['avg_'+k] = avg(tr.map(d=>d[k])); });

  R.ma = mealAnalysis(tr);
  R.dayF = dayFactorsV2(tr);
  R.fs = factorList(R,'s');
  R.fg = factorList(R,'g');
  R.curMean = avg(tr.map(dayScore));
  { const prev = rangeKeys(2*n).slice(0,n).map(dayStats).filter(d=>d.tracked); R.prevN = prev.length; R.prevMean = prev.length ? avg(prev.map(dayScore)) : null; }
  R.trend = ds.map((d,i)=>{ const w = ds.slice(Math.max(0,i-6), i+1).filter(x=>x.tracked); return w.length ? {k:d.k, s:avg(w.map(dayScore)), g:avg(w.map(dayGasW))} : {k:d.k, s:null, g:null}; });

  const meals = S.entries.filter(e=>e.type==='meal');
  if(stools.length >= 4 && meals.length){
    const after = stools.filter(s=>meals.some(m=>s.t-m.t>=0 && s.t-m.t<=120*60000));
    R.afterMealPct = after.length/stools.length;
    const painsAfter = pains.filter(p=>meals.some(m=>p.t-m.t>=0 && p.t-m.t<=120*60000));
    R.painAfterMealPct = pains.length ? painsAfter.length/pains.length : null;
    R.insights.push({title:'Stuhlgang bis 2 Stunden nach dem Essen', single:true, big:pct(R.afterMealPct), sub:`${after.length} von ${stools.length} Stuhlgängen${pains.length?` · Schmerzen nach dem Essen: ${pct(R.painAfterMealPct)}`:''}`});
  }

  const allKeys = [...new Set([...Object.keys(byDay), ...Object.keys(S.days)])].sort();
  const start = allKeys.find(k=>(S.days[k]||{}).chol>0);
  if(start){
    const before=[], after=[];
    for(let i=1;i<=14;i++){ const s=getS(addDays(start,-i)); if(s.tracked) before.push(s); }
    for(let k=start; k<=todayKey(); k=addDays(k,1)){ const s=getS(k); if(s.tracked) after.push(s); }
    const f = arr => { const st=arr.flatMap(d=>d.st); return {n:arr.length, stool:avg(arr.map(d=>d.stool)), loose: st.length? st.filter(e=>e.bristol>=6).length/st.length : null, pain:avg(arr.map(d=>d.pain)), lop:avg(arr.map(d=>d.lop))}; };
    R.chol = {start, before:f(before), after:f(after), days: Math.round((keyDate(todayKey())-keyDate(start))/864e5)+1};
  }
  return R;
}

function chartSVG(ds, field, opts){
  const n = ds.length, W = 340, H = opts.h||140, pl = 20, pr = 4, pt = 8, pb = 18;
  const iw = W-pl-pr, ih = H-pt-pb, cw = iw/n, bw = Math.max(2.5, Math.min(18, cw*0.64));
  const vals = ds.map(d=>d[field]);
  const max = Math.max(opts.minMax||4, ...vals);
  const step = max>12 ? Math.ceil(max/4) : (max>6 ? 2 : 1);
  const top = Math.ceil(max/step)*step;
  const y = v => pt + ih - (v/top)*ih;
  let g = '';
  for(let v=0; v<=top; v+=step){ g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  let bars = '';
  const every = n<=7 ? 1 : (n<=14 ? 2 : 5);
  ds.forEach((d,i)=>{
    const x = pl + i*cw + (cw-bw)/2;
    if(!d.tracked){ bars += `<rect class="f-none" x="${x}" y="${y(0)-1.5}" width="${bw}" height="1.5"/>`; }
    else if(opts.stack){
      const loose = d.loose - d.liquid, liquid = d.liquid, rest = d.stool - d.loose;
      let base = 0;
      [[rest,'f-ok'],[loose,'f-loose'],[liquid,'f-liquid']].forEach(([v,c])=>{ if(v>0){ bars += `<rect class="${c}" x="${x}" y="${y(base+v)}" width="${bw}" height="${y(base)-y(base+v)}" rx="2"/>`; base+=v; } });
    } else if(d[field]>0){
      bars += `<rect class="f-acc" x="${x}" y="${y(d[field])}" width="${bw}" height="${y(0)-y(d[field])}" rx="2"/>`;
    }
    if(i%every===0 || i===n-1){ const dd = keyDate(d.k); bars += `<text x="${pl+i*cw+cw/2}" y="${H-5}" text-anchor="middle">${dd.getDate()}.${n<=7?(dd.getMonth()+1)+'.':''}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}${bars}</svg>`;
}

function expOption(id){

  if(t==='f:' || t==='v:'){ const f = FMAP.get(k); return f ? {key:'f:'+k, label:`ohne ${f.name}`, btn:`7-Tage-Experiment: ohne ${f.name}`} : null; }

  if(t==='z:'){ return {key:id, label:`ohne „${featName(id)}“`, btn:`7-Tage-Experiment: ohne „${featName(id)}“`}; }

}
function startExp(id, days){
  const o = expOption(id); if(!o) return;
  S.meta.exps = S.meta.exps || [];
  S.meta.exps.push({id:uid(), key:o.key, label:o.label, start:todayKey(), len:days||7});
  save(); closeSheet(); tab='heute'; render(); window.scrollTo(0,0);
  toast('Experiment gestartet');

function expDayNo(e){ return Math.round((keyDate(todayKey())-keyDate(e.start))/864e5)+1; }
function expEval(e){
  const inKeys = [], beforeKeys = [];
  for(let i=0;i<e.len;i++){ const k = addDays(e.start,i); if(k<=todayKey()) inKeys.push(k); }
  for(let i=1;i<=14;i++) beforeKeys.push(addDays(e.start,-i));
  const W3 = 3*3600e3, evs = S.entries.filter(isS), now = Date.now();
  const stat = keys => {
    const ds = keys.map(dayStats).filter(d=>d.tracked && d.k!==todayKey());
    let mr = 0, mn = 0;
    keys.map(dayStats).forEach(d=>d.me.forEach(m=>{ const ev = evs.some(x=>x.t>m.t && x.t-m.t<=W3); if(!ev && now-m.t<W3) return; mn++; if(ev) mr++; }));
    return {n:ds.length, burden: ds.length ? avg(ds.map(dayBurden)) : null, reflex: mn ? mr/mn : null, meals:mn};
  };
  let adh = '';
  const t = e.key.slice(0,2), k = e.key.slice(2);
  const meals = inKeys.flatMap(x=>dayStats(x).me);
  if(t==='f:') { const c = meals.filter(m=>mealFoods(m).includes(k)).length; adh = c ? `${c}× trotzdem gegessen` : 'eingehalten'; }
  else if(t==='p:') { const c = meals.filter(m=>mealProps(m).has(k)).length; adh = c ? `${c}× trotzdem gegessen` : 'eingehalten'; }
  else if(t==='z:') { const c = meals.filter(m=>(m.flags||[]).includes(k)).length; adh = c ? `${c}× trotzdem` : 'eingehalten'; }
  else if(e.key==='n:beerPrev'){ const v = inKeys.map(x=>(S.days[x]||{}).beer||0); adh = `Ø ${num(avg(v))} Bier pro Abend`; }
  else if(e.key==='n:coffee'){ const v = inKeys.map(x=>(S.days[x]||{}).coffee||0); adh = `Ø ${num(avg(v))} Tassen pro Tag`; }
  else if(e.key==='n:cigs'){ adh = 'Rauchzeit wird nicht erfasst'; }
  return {during:stat(inKeys), before:stat(beforeKeys), adh};
}
function expsHTML(compact){

function suspectVerdict3(id){
  const cands = [];
  [['reflex','f:'+id],['tage','f:'+id],['tage','v:'+id],['gas','f:'+id],['gas','v:'+id]].forEach(([kind,fid])=>{
    const M = runModel(kind, 'foods', range); if(!M.ready) return;
    const f = M.feats.find(x=>x.id===fid); if(f) cands.push({M,f});
  });
  const rank = {stark:3, mittel:2, hinweis:1, keins:0};
  const ups = cands.filter(c=>c.f.dir==='up').sort((a,b)=>rank[b.f.ev]-rank[a.f.ev] || b.f.eff-a.f.eff);
  const best = ups[0];
  if(best && (best.f.ev==='stark' || best.f.ev==='mittel')) return {c: best.f.ev==='stark'?'hi':'up', t:`${best.f.ev==='stark'?'Bestätigt':'Wahrscheinlich'}: ${featSentence(best.M,best.f)}`, drv:best.M.kind+'|'+best.f.id, test:true};
  if(best && best.f.ev==='hinweis') return {c:'flat', t:`Schwacher Hinweis: ${featSentence(best.M,best.f)}`, drv:best.M.kind+'|'+best.f.id};
  if(cands.length) return {c:'down', t:'Deine Daten bestätigen den Verdacht bisher nicht', drv:cands[0].M.kind+'|'+cands[0].f.id};
  return {c:'na', t:'Noch zu wenig Daten, um den Verdacht zu prüfen'};
}

function trendSVG(R){
  const T = R.trend, n = T.length, W = 340, H = 130, pl = 20, pr = 6, pt = 8, pb = 18;
  const iw = W-pl-pr, ih = H-pt-pb;
  const vals = T.flatMap(t=>[t.s,t.g]).filter(v=>v!=null);
  if(T.filter(t=>t.s!=null).length < 2) return '<p class="note">Für einen Verlauf braucht es ein paar erfasste Tage mehr.</p>';
  const max = Math.max(2, ...vals), step = max>8 ? 2 : 1, top = Math.ceil(max/step)*step;
  const x = i => pl + (n===1 ? iw/2 : i*iw/(n-1)), y = v => pt + ih - v/top*ih;
  let g = ''; for(let v=0; v<=top; v+=step) g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  const path = key => { let d = '', pen = false; T.forEach((t,i)=>{ if(t[key]==null){ pen = false; return; } d += (pen?'L':'M')+x(i).toFixed(1)+' '+y(t[key]).toFixed(1)+' '; pen = true; }); return d; };
  const last = (key, cls) => { for(let i=n-1;i>=0;i--) if(T[i][key]!=null) return `<circle cx="${x(i).toFixed(1)}" cy="${y(T[i][key]).toFixed(1)}" r="3.5" class="${cls}"/>`; return ''; };
  const every = n<=7 ? 1 : (n<=14 ? 2 : (n<=30 ? 5 : 10));
  let lab = ''; T.forEach((t,i)=>{ if(i%every===0){ const d = keyDate(t.k); lab += `<text x="${x(i).toFixed(1)}" y="${H-5}" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}.</text>`; } });
  let mark = '';
  (S.meta.exps||[]).forEach(e=>{ const i = T.findIndex(t=>t.k===e.start); if(i>=0) mark += `<line class="mark" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt+ih}"/><text x="${x(i)+3}" y="${pt+9}" text-anchor="start">${esc(e.label)}</text>`; });
  if(R.chol){ const i = T.findIndex(t=>t.k===R.chol.start); if(i>=0) mark += `<line class="mark" x1="${x(i)}" x2="${x(i)}" y1="${pt}" y2="${pt+ih}"/><text x="${x(i)+3}" y="${pt+20}" text-anchor="start">Colestyramin</text>`; }

function hourProfileHTML(){
  const keys = new Set(rangeKeys(range));
  const bins = new Array(12).fill(0), mb = new Array(12).fill(0);
  S.entries.forEach(e=>{ if(!keys.has(dayKey(e.t))) return; const b = Math.floor(new Date(e.t).getHours()/2); if(isS(e)) bins[b]++; else if(e.type==='meal') mb[b]++; });
  const tot = bins.reduce((a,b)=>a+b,0); if(tot<5) return '';
  const W = 340, H = 120, pl = 6, pr = 6, pt = 8, pb = 20, iw = W-pl-pr, ih = H-pt-pb, bw = iw/12;
  const mx = Math.max(...bins, 1), mm = Math.max(...mb, 1);
  let g = '';
  bins.forEach((v,i)=>{ const h = v/mx*ih; g += `<rect class="f-liquid" x="${(pl+i*bw+bw*0.15).toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3"/>`; if(mb[i]) g += `<circle class="mdot" cx="${(pl+i*bw+bw/2).toFixed(1)}" cy="${(pt+ih+4).toFixed(1)}" r="${(1.5+mb[i]/mm*3).toFixed(1)}"/>`; if(i%2===0) g += `<text x="${(pl+i*bw).toFixed(1)}" y="${H-3}" text-anchor="start">${i*2}</text>`; });
  return `<div class="card"><div class="card-head"><h2>Tageszeit</h2></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Beschwerden nach Uhrzeit">${g}</svg>
    <p class="note">Rote Balken: Beschwerden nach Uhrzeit, in 2-Stunden-Schritten. Punkte unten: wann du isst. Liegen Balken kurz nach den Punkten, ist das der Reflex nach dem Essen.</p></div>`;
}

function methodHTML3(){
  return `<details class="card method"><summary><h2>So rechnet die App</h2></summary>
    <ul class="mlist">
      <li><b>Drei Fragen statt einer Liste:</b> Reflex nach dem Essen, schlechte Tage und Blähungen haben unterschiedliche Ursachen und Zeitabläufe. Jede Frage hat ihr eigenes Modell.</li>
      <li><b>Alle Faktoren gleichzeitig:</b> Lebensmittel, Tageszeit, Bürotag, Stress, Schlaf, Kaffee, Zigaretten und Bier vom Vorabend stehen zusammen im Modell. Wenn Salami nur auffällt, weil sie immer im Büro gegessen wird, rechnet das Modell das heraus.</li>
      <li><b>Bremse gegen Zufallstreffer:</b> Bei wenigen Fällen zieht das Modell jeden Effekt Richtung „kein Unterschied“. Drei schlechte Tage nach Brokkoli reichen nicht für einen Verdacht.</li>
      <li><b>Stabilitätsprüfung:</b> Das Modell wird 80-mal mit zufällig ausgewählten Tagen neu berechnet. „Starker Hinweis“ heißt: mindestens 90 % davon zeigen in dieselbe Richtung, und der Effekt ist mindestens 25 % groß.</li>
      <li><b>Erst ab genug Daten:</b> Reflex ab 20 Mahlzeiten, Tage und Blähungen ab 14 Tagen. Ein Faktor braucht mindestens 3 Fälle mit und 3 ohne.</li>
      <li><b>Beschwerdelast:</b> Stuhlgänge ab Typ 5 oder dringend zählen je nach Menge 0,5 / 1 / 1,5, Schmerzen 1, starke Schmerzen ab 7 zählen 1,5.</li>
      <li><b>Zusammenhang ist kein Beweis.</b> Den Beweis liefert ein Experiment: eine Sache 7 Tage ändern und vergleichen.</li>
    </ul></details>`;
}

  if(!R.tr.length) return 'Noch keine Daten im gewählten Zeitraum.';
  const first = R.tr[0].k, last = R.tr[R.tr.length-1].k;
  const L = [];
  L.push('Darmtagebuch – Zusammenfassung');

  if(R.gasCount) L.push(`Blähungen: ${R.gasCount}× (Ø ${num(R.gasDay)} pro Tag); übel riechend: ${pct(R.gasSmellPct)}, laut: ${pct(R.gasLoudPct)}`);
  const mine = [...mySuspects().entries()].map(([id,o])=> o.text!=null ? `${o.text} (noch nicht zugeordnet)` : `${(FMAP.get(id)||{}).name} (${suspectVerdict3(id).t})`);
  if(mine.length) L.push('Selbst vermutete Auslöser: '+mine.join('; '));
  [['reflex','Reflex nach dem Essen'],['tage','Schlechte Tage'],['gas','Blähungen']].forEach(([k,lab])=>{

  (S.meta.exps||[]).forEach(e=>{ const r = expEval(e); if(r.during.burden!=null && r.before.burden!=null) L.push(`Experiment „${e.label}“ ab ${fmtDate(e.start)}: Beschwerdelast pro Tag ${num(r.during.burden)} statt ${num(r.before.burden)} vorher`); });
  L.push('');
  L.push(`Loperamid: Ø ${num(R.avg_lop)} Kapseln/Tag`);
  if(R.chol){ const c=R.chol; L.push(`Colestyramin seit ${fmtDate(c.start)}: Stuhlgänge/Tag ${c.before.n?num(c.before.stool)+' vorher → ':''}${num(c.after.stool)} seit Beginn; Typ 6–7 ${c.before.n?pct(c.before.loose)+' → ':''}${pct(c.after.loose)}`); }
  L.push(`Bier: Ø ${num(R.avg_beer)} × 500 ml/Tag · Zigaretten: Ø ${num(R.avg_cigs,0)}/Tag · Kaffee: Ø ${num(R.avg_coffee)} Tassen/Tag`);

async function copyText(txt, fallbackEl){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    if(fallbackEl){ fallbackEl.value = txt; fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}
function doImport(){
  const box = $('#importbox'); const raw = (box.value||'').trim();
  if(!raw){ toast('Zuerst einen Sicherungstext einfügen.'); return; }
  let d;
  try{ d = JSON.parse(raw); }catch(e){ toast('Das ist kein gültiger Sicherungstext.'); return; }
  if(!d || !Array.isArray(d.entries)){ toast('Im Text fehlen die Einträge.'); return; }
  const ids = new Set(S.entries.map(e=>e.id)); let added = 0;
  d.entries.forEach(e=>{ if(e && e.id && typeof e.t==='number' && !ids.has(e.id)){ S.entries.push(e); ids.add(e.id); added++; } });
  Object.entries(d.days||{}).forEach(([k,v])=>{ S.days[k] = Object.assign({}, S.days[k]||{}, v); });
  if(Array.isArray(d.foods)){
    const list = ensureCustomFoods();
    d.foods.forEach(f=>{ if(!f || !f.id || !f.name) return; const i = list.findIndex(x=>x.id===f.id); if(i>=0) list[i] = f; else list.push(f); });
  }
  if(d.win) S.meta.win = d.win;
  if(Array.isArray(d.exps)){ S.meta.exps = S.meta.exps||[]; d.exps.forEach(e=>{ if(e && e.id && !S.meta.exps.some(x=>x.id===e.id)) S.meta.exps.push(e); }); }
  save(); box.value=''; render(); toast(`${added} Einträge wiederhergestellt`);
}
