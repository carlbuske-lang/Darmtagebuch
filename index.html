<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Darmtagebuch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Darmtagebuch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EDF1EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: eine schmale Spalte für das Handy, Schnell-Erfassung oben, Tab-Leiste unten am Daumen */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#E2E8E5; --ink:#17201D; --muted:#56645F; --line:#D1DAD6;
  --accent:#8E5C08; --accent-ink:#FFFFFF; --accent-soft:#F5E6C6;
  --b-hard:#3B66A6; --b-ok:#2C7A4F; --b-soft:#AD7A0C; --b-liquid:#B83C32;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,30,26,.06), 0 6px 20px rgba(20,30,26,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#18201D; --sunk:#212A26; --ink:#E5EBE8; --muted:#98A6A1; --line:#2C3733;
  --accent:#E4A742; --accent-ink:#1A1304; --accent-soft:#3A2C12;
  --b-hard:#80A7E2; --b-ok:#5EC089; --b-soft:#E2B04B; --b-liquid:#F07B6F;
  --shadow:none; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#18201D; --sunk:#212A26; --ink:#E5EBE8; --muted:#98A6A1; --line:#2C3733;
  --accent:#E4A742; --accent-ink:#1A1304; --accent-soft:#3A2C12;
  --b-hard:#80A7E2; --b-ok:#5EC089; --b-soft:#E2B04B; --b-liquid:#F07B6F;
  --shadow:none; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem}
h2{font-size:1.15rem}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card > .label{display:block;margin-bottom:10px}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.datenav{display:flex;align-items:center;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.2rem;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:default}
.datelabel{min-width:104px;text-align:center;font-weight:700}

/* Tageszahlen */
.today-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

/* Schnell-Erfassung */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{min-height:76px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;padding:8px 4px;box-shadow:var(--shadow)}
.quick button svg{color:var(--accent)}
.quick svg{width:24px;height:24px}

/* Zeitleiste */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li + li{border-top:1px solid var(--line)}
.entry{width:100%;display:grid;grid-template-columns:48px 14px 1fr;gap:10px;align-items:start;text-align:left;background:none;border:0;padding:11px 0}
.entry .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;padding-top:1px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--muted)}
.entry .what{min-width:0}
.entry .what b{display:block}
.entry .what small{display:block;color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:6px 0 2px}

.c-hard{background:var(--b-hard)} .c-ok{background:var(--b-ok)} .c-soft{background:var(--b-soft)} .c-liquid{background:var(--b-liquid)}
.c-pain{background:var(--b-liquid);border-radius:3px;transform:rotate(45deg) scale(.85)}
.c-meal{background:transparent;border:2px solid var(--muted)}

/* Zähler */
.counter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 0}
.counter + .counter{border-top:1px solid var(--line)}
.counter .name b{display:block}
.counter .name small{color:var(--muted);font-size:.82rem}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sunk)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:1.3rem;line-height:1}
.stepper output{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1rem}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale .chip{padding:0;min-height:40px;border-radius:10px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px}
.field + .field{margin-top:14px}
textarea,input[type=text],input[type=datetime-local]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:10px 12px;min-height:44px}
textarea{min-height:76px;resize:vertical}

/* Bristol-Auswahl */
.bristol{display:flex;flex-direction:column;gap:6px}
.bristol button{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:44px}
.bristol button .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.bristol button small{color:var(--muted);font-size:.8rem}
.bristol button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

/* Buttons */
.btn{min-height:46px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--b-liquid);border-color:var(--b-liquid);background:transparent}
.btn.danger.armed{background:var(--b-liquid);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}

/* Tab-Leiste */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.78rem;color:var(--muted);font-weight:700}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* Bottom Sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.45);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:calc(100% - 70px);overflow:auto;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;position:sticky;top:-8px;z-index:2;background:var(--bg);padding-block:8px}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:12px;margin-top:16px;padding-bottom:4px}
.err{color:var(--b-liquid);font-weight:700;font-size:.9rem;margin-top:8px}

/* Verlauf */
.days{list-style:none;margin:0;padding:0}
.days li + li{border-top:1px solid var(--line)}
.dayrow{width:100%;background:none;border:0;text-align:left;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.dayrow .d{font-weight:700}
.dayrow .meta{grid-column:1 / -1;color:var(--muted);font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.pips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.pips i{width:10px;height:10px;border-radius:50%;display:block}

/* Auswertung */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.f-ok{fill:var(--b-ok)} .f-loose{fill:var(--b-soft)} .f-liquid{fill:var(--b-liquid)} .f-acc{fill:var(--accent)} .f-none{fill:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.insight h3{font-size:1rem;margin-bottom:10px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:.9rem}
.cmp .bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-bottom:6px}
.cmp .bar span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.cmp .bar.b span{background:var(--muted)}
.cmp b{font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.note{font-size:.85rem;color:var(--muted)}
.banner{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner p{margin:0;font-size:.92rem}
.banner button{background:none;border:0;color:var(--accent);font-weight:700;min-height:36px;white-space:nowrap}
pre.summary{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--sunk);border-radius:12px;padding:12px;font-size:.86rem;margin:0;font-family:var(--f-body);max-height:320px;overflow:auto}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){
  .sheet:not([hidden]){animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>

<div id="app">
  <div id="view"></div>
</div>

<nav class="tabs" aria-label="Bereiche"><div class="inner">
  <button data-tab="heute" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Tag</button>
  <button data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Verlauf</button>
  <button data-tab="auswertung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Auswertung</button>
  <button data-tab="daten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Daten</button>
</div></nav>

<div class="scrim" hidden></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>
<div class="toast" role="status" hidden></div>

<script>
(function(){
"use strict";
const KEY = 'darmtagebuch.v1';
let S = {v:1, entries:[], days:{}, meta:{}};
let storageOK = true;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.entries)) S = {v:1, entries:d.entries, days:d.days||{}, meta:d.meta||{}};
    }
  }catch(e){ storageOK = false; }
}
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function save(){ saveLocal(); queueSync(); }

/* ---------- Synchronisierung mit dem Claude-Konto ---------- */
let COL = null, synced = false, lastSent = {}, writing = false, wTimer = null, syncState = 'init', errShown = false;
const SYNC_TEXT = {
  init:'Verbinde mit deinem Claude-Konto …',
  ok:'Synchronisiert mit deinem Claude-Konto. PC und Handy zeigen dieselben Daten.',
  wait:'Dein Konto ist gerade nicht erreichbar. Neue Einträge bleiben auf diesem Gerät und werden übertragen, sobald die Verbindung steht.',
  err:'Synchronisieren hat nicht geklappt. Deine Einträge sind auf diesem Gerät gesichert. Lade die Seite später neu.',
  local:'Nur auf diesem Gerät gespeichert, weil keine Verbindung zum Claude-Konto besteht.',
  device:'Gespeichert nur auf diesem Handy, in dieser App. Mach ab und zu eine Sicherung und leg sie in einer Notiz ab.'
};
function setSync(st){
  syncState = st;
  const el = document.getElementById('syncstate'); if(el) el.textContent = SYNC_TEXT[st];
  if(st==='err' && !errShown){ errShown = true; toast('Synchronisieren fehlgeschlagen'); }
}
function payloads(){
  index();
  const out = {};
  const keys = new Set([...Object.keys(byDay), ...Object.keys(S.days), ...Object.keys(lastSent).filter(k=>k.startsWith('d-')).map(k=>k.slice(2))]);
  keys.forEach(k=>{
    const es = byDay[k] || []; const d = S.days[k] || {};
    const has = es.length || Object.keys(d).some(x=>d[x]!=null && d[x]!==0 && d[x]!=='');
    out['d-'+k] = has ? {entries:es, day:d} : null;
  });
  out.meta = {lastBackup:S.meta.lastBackup||0, hintDone:!!S.meta.hintDone, show:S.meta.show||{}};
  return out;
}
function queueSync(){ if(!COL || !synced) return; clearTimeout(wTimer); wTimer = setTimeout(flush, 600); }
async function flush(){
  wTimer = null;
  if(writing){ wTimer = setTimeout(flush, 400); return; }
  writing = true;
  try{
    const p = payloads();
    for(const [id, body] of Object.entries(p)){
      const js = body ? JSON.stringify(body) : null;
      if((lastSent[id] ?? null) === js) continue;
      if(body) await COL.doc(id).set(JSON.parse(js)); else await COL.doc(id).delete();
      if(js==null) delete lastSent[id]; else lastSent[id] = js;
    }
    setSync('ok');
  }catch(e){ setSync('err'); }
  finally{ writing = false; }
}
function readRemote(snap){
  const r = {entries:[], days:{}, meta:null, sent:{}};
  snap.docs.forEach(doc=>{
    const d = doc.data(); if(!d) return;
    r.sent[doc.id] = JSON.stringify(d);
    if(doc.id==='meta') r.meta = d;
    else if(doc.id.startsWith('d-')){
      (d.entries||[]).forEach(e=>r.entries.push(JSON.parse(JSON.stringify(e))));
      if(d.day && Object.keys(d.day).length) r.days[doc.id.slice(2)] = JSON.parse(JSON.stringify(d.day));
    }
  });
  return r;
}
function busyTyping(){ const a = document.activeElement; return !!(a && (a.id==='daynote' || a.id==='importbox')); }
function onRemote(snap){
  const r = readRemote(snap);
  if(!synced){
    // Erste Verbindung: Konto-Daten und lokale Daten zusammenführen
    const ids = new Set(r.entries.map(e=>e.id));
    const entries = r.entries.concat(S.entries.filter(e=>!ids.has(e.id)));
    const days = Object.assign({}, S.days);
    Object.entries(r.days).forEach(([k,v])=>{ days[k] = Object.assign({}, S.days[k]||{}, v); });
    const meta = Object.assign({}, S.meta, r.meta||{}, {show:Object.assign({}, S.meta.show||{}, (r.meta||{}).show||{})});
    S = {v:1, entries, days, meta};
    lastSent = r.sent; synced = true; setSync('ok');
    saveLocal(); queueSync();
    if(!busyTyping()) render();
    return;
  }
  if(snap.metadata.hasPendingWrites || writing || wTimer) return;
  S = {v:1, entries:r.entries, days:r.days, meta:Object.assign({}, S.meta, r.meta||{})};
  lastSent = r.sent; saveLocal(); setSync('ok');
  if(!busyTyping()) render();
}
async function initSync(){
  try{
    if(!window.claude || typeof window.claude.use!=='function'){ setSync('local'); return; }
    const db = await window.claude.use('db');
    const user = await window.claude.use('user');
    const id = user ? await user.id() : null;
    if(!db || !id){ setSync('local'); return; }
    COL = db.collection('data/users/'+id);
    const t = setTimeout(()=>{ if(!synced) setSync('wait'); }, 10000);
    COL.onSnapshot(snap=>{
      if(snap.metadata.fromCache && !synced) return;
      clearTimeout(t); onRemote(snap);
    }, ()=>{ clearTimeout(t); setSync(synced?'err':'local'); });
  }catch(e){ setSync('local'); }
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dayKey = ms => { const d = new Date(ms); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const keyDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (k,n) => { const d = keyDate(k); d.setDate(d.getDate()+n); return dayKey(d.getTime()); };
const todayKey = () => dayKey(Date.now());
const fmtDate = k => keyDate(k).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtDayLong = k => keyDate(k).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
const fmtDay = k => k===todayKey() ? 'Heute' : (k===addDays(todayKey(),-1) ? 'Gestern' : fmtDayLong(k));
const fmtTime = ms => { const d = new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const num = (x,d=1) => (x==null || isNaN(x)) ? '–' : Number(x).toLocaleString('de-DE',{maximumFractionDigits:d});
const pct = x => (x==null || isNaN(x)) ? '–' : Math.round(x*100)+' %';
const avg = a => a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
const toLocalInput = ms => { const d = new Date(ms); return dayKey(ms)+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); };
const fromLocalInput = v => { if(!v) return null; const [a,b] = v.split('T'); const [y,m,d] = a.split('-').map(Number); const [h,mi] = (b||'12:00').split(':').map(Number); const t = new Date(y,m-1,d,h,mi).getTime(); return isNaN(t)?null:t; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const BRISTOL = {
  1:{t:'Harte Kügelchen', s:'wie Nüsse, schwer', c:'hard'},
  2:{t:'Klumpige Wurst', s:'fest, uneben', c:'hard'},
  3:{t:'Wurst mit Rissen', s:'normal', c:'ok'},
  4:{t:'Glatt und weich', s:'normal', c:'ok'},
  5:{t:'Weiche Stücke', s:'klare Ränder', c:'soft'},
  6:{t:'Breiig, flockig', s:'ausgefranst', c:'soft'},
  7:{t:'Wässrig', s:'keine festen Teile', c:'liquid'}
};
const MEAL_TAGS = ['Fettreich','Schmorgericht','Frittiert','Scharf','Tomate / dunkle Sauce','Milchprodukt','Obst / Fructose','Süßstoff / Light','Brioche / Butterteig','Große Portion','Leicht / vorsichtig'];
const FAT_TAGS = ['Fettreich','Schmorgericht','Frittiert','Brioche / Butterteig'];
const PAIN_LOCS = ['Links oben','Rechts oben','Mitte oben','Unterbauch','Ganzer Bauch'];
const PAIN_KIND = ['Krampf','Druck / Gas','Brennen','Stechend'];
const DTYPES = ['Büro','Homeoffice','Frei','Reise'];

  {k:'coffee',label:'Kaffee',          unit:'Tassen'},

/* ---------- Auswertung je Tag ---------- */
let byDay = {};
function index(){
  byDay = {};
  S.entries.sort((a,b)=>a.t-b.t);
  for(const e of S.entries){ const k = dayKey(e.t); (byDay[k] = byDay[k] || []).push(e); }
}
function dayStats(k){
  const es = byDay[k] || [];
  const st = es.filter(e=>e.type==='stool'), pa = es.filter(e=>e.type==='pain'), me = es.filter(e=>e.type==='meal');
  const d = S.days[k] || {};
  const br = st.map(e=>e.bristol).filter(Boolean);
  const tracked = es.length>0 || COUNTERS.some(c=>(d[c.k]||0)>0) || d.stress!=null || !!d.dtype || !!(d.note||'').trim();
  return {
    k, es, st, pa, me, tracked,
    stool: st.length, loose: st.filter(e=>e.bristol>=6).length, liquid: st.filter(e=>e.bristol===7).length,
    urgent: st.filter(e=>e.urgent).length, fatty: st.filter(e=>e.fatty).length,
    avgB: br.length ? avg(br) : null,
    pain: pa.length, painMax: pa.length ? Math.max(...pa.map(e=>e.pain||0)) : 0,
    fatMeal: me.some(e=>(e.tags||[]).some(t=>FAT_TAGS.includes(t))),
    beer:d.beer||0, cigs:d.cigs||0, coffee:d.coffee||0, lop:d.lop||0, chol:d.chol||0, psyll:d.psyll||0, mint:d.mint||0,
    stress: d.stress ?? null, dtype: d.dtype || null, note: d.note || ''
  };
}
function rangeKeys(n){ const out=[]; const t=todayKey(); for(let i=n-1;i>=0;i--) out.push(addDays(t,-i)); return out; }

    return {dot:'c-'+b.c, title:'Stuhlgang · Typ '+e.bristol, sub:[b.t, ...flags, e.note].filter(Boolean).join(' · ')};

/* ---------- Bottom Sheet ---------- */
function defaultTime(){
  if(cur===todayKey()) return Date.now();
  const d = keyDate(cur); d.setHours(12,0,0,0); return d.getTime();
}
const DRAFT_KEY = 'darmtagebuch.entwurf';
function readInputs(){
  const sh = $('.sheet'); if(!draft || !sh) return;
  const w = sh.querySelector('#when'); if(w){ const t = fromLocalInput(w.value); if(t!=null) draft.t = t; }
  const n = sh.querySelector('#enote'); if(n) draft.note = n.value;
  const m = sh.querySelector('#meal-text'); if(m) draft.text = m.value;
}
function stashDraft(){ if(!draft) return; readInputs(); try{ localStorage.setItem(DRAFT_KEY, JSON.stringify({d:draft, at:Date.now()})); }catch(e){} }
function getStash(){ try{ const r = JSON.parse(localStorage.getItem(DRAFT_KEY)||'null'); if(r && r.d && Date.now()-r.at < 3*3600e3) return r.d; }catch(e){} return null; }
function clearStash(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
function openSheet(type, id, restored){
  const e = id ? S.entries.find(x=>x.id===id) : null;
  const st = restored || getStash();
  if(st && ((id && st.id===id) || (!id && !st.id && st.type===type))) draft = JSON.parse(JSON.stringify(st));
  else if(e) draft = JSON.parse(JSON.stringify(e));
  else {
    draft = {id:null, type, t:defaultTime(), note:''};
    if(type==='stool'){ draft.bristol=null; draft.urgent=false; draft.fatty=false; draft.burn=false; }
    if(type==='pain'){ draft.pain=null; draft.loc=[]; draft.kind=[]; }
    if(type==='meal'){ draft.text=''; draft.tags=[]; }
  }
  const sh = $('.sheet');
  sh.innerHTML = sheetHTML();
  sh.hidden = false; $('.scrim').hidden = false;
  document.body.style.overflow = 'hidden';
  stashDraft();
  setTimeout(()=>{ const f = sh.querySelector('#meal-text'); if(f && !id) f.focus(); }, 60);
}
function closeSheet(){
  $('.sheet').hidden = true; $('.scrim').hidden = true; draft = null; clearStash();
  document.body.style.overflow = '';
}

function saveEntry(){
  const sh = $('.sheet');
  const err = sh.querySelector('#sheet-err');
  const t = fromLocalInput(sh.querySelector('#when').value);
  draft.note = sh.querySelector('#enote').value.trim();
  if(draft.type==='meal') draft.text = sh.querySelector('#meal-text').value.trim();
  let msg = '';
  if(t==null) msg = 'Bitte einen gültigen Zeitpunkt wählen.';
  else if(draft.type==='stool' && !draft.bristol) msg = 'Bitte die Konsistenz wählen.';
  else if(draft.type==='pain' && !draft.pain) msg = 'Bitte die Stärke wählen.';
  else if(draft.type==='meal' && !draft.text && !(draft.tags||[]).length) msg = 'Bitte eintragen, was du gegessen hast, oder ein Merkmal wählen.';
  if(msg){ err.textContent = msg; err.hidden = false; return; }
  draft.t = t;
  const isNew = !draft.id;
  if(isNew){ draft.id = uid(); S.entries.push(draft); }
  else { const i = S.entries.findIndex(x=>x.id===draft.id); if(i>=0) S.entries[i] = draft; }
  cur = dayKey(t);
  save(); closeSheet(); render();
  toast(isNew ? 'Gespeichert' : 'Änderung gespeichert');
}

/* ---------- Auswertung ---------- */
let range = 14;
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }

function analyze(n){
  const keys = rangeKeys(n);
  const ds = keys.map(dayStats);
  const tr = ds.filter(d=>d.tracked);
  const all = {};
  const getS = k => all[k] || (all[k] = dayStats(k));
  const R = {keys, ds, tr, insights:[]};
  if(!tr.length) return R;

  const stools = tr.flatMap(d=>d.st);
  R.avgStool = avg(tr.map(d=>d.stool));
  R.minStool = Math.min(...tr.map(d=>d.stool)); R.maxStool = Math.max(...tr.map(d=>d.stool));
  R.avgB = avg(stools.map(e=>e.bristol).filter(Boolean));
  R.loosePct = stools.length ? stools.filter(e=>e.bristol>=6).length/stools.length : null;
  R.urgentPct = stools.length ? stools.filter(e=>e.urgent).length/stools.length : null;
  R.fattyPct = stools.length ? stools.filter(e=>e.fatty).length/stools.length : null;
  R.burnPct = stools.length ? stools.filter(e=>e.burn).length/stools.length : null;
  const pains = tr.flatMap(d=>d.pa);
  R.painCount = pains.length; R.painAvg = avg(pains.map(e=>e.pain||0));
  const locs = {}; pains.forEach(p=>(p.loc||[]).forEach(l=>locs[l]=(locs[l]||0)+1));
  R.painLocs = Object.entries(locs).sort((a,b)=>b[1]-a[1]);
  ['beer','cigs','coffee','lop','chol'].forEach(k=>R['avg_'+k]=avg(tr.map(d=>d[k])));

  // Stuhl kurz nach dem Essen
  const meals = S.entries.filter(e=>e.type==='meal');
  if(stools.length >= 4 && meals.length){
    const after = stools.filter(s=>meals.some(m=>s.t-m.t>=0 && s.t-m.t<=120*60000));
    R.afterMealPct = after.length/stools.length;
    const painsAfter = pains.filter(p=>meals.some(m=>p.t-m.t>=0 && p.t-m.t<=120*60000));
    R.painAfterMealPct = pains.length ? painsAfter.length/pains.length : null;
    R.insights.push({title:'Stuhlgang bis 2 Stunden nach dem Essen', single:true, big:pct(R.afterMealPct), sub:`${after.length} von ${stools.length} Stuhlgängen${pains.length?` · Schmerzen nach dem Essen: ${pct(R.painAfterMealPct)}`:''}`});
  }

  // Vergleichshelfer: Gruppen mit Tageswerten
  function cmp(title, la, a, lb, b, unit, hint){
    if(a.length<2 || b.length<2) return;
    R.insights.push({title, la, lb, va:avg(a), vb:avg(b), na:a.length, nb:b.length, unit, hint});
  }
  // Fett -> Folgetag
  {
    const A=[], B=[];
    tr.forEach(d=>{ const nx = getS(addDays(d.k,1)); if(!nx.tracked || nx.k>todayKey()) return; (d.fatMeal?A:B).push(nx.stool); });
    cmp('Fettreiches Essen → Stuhlgänge am Folgetag','nach fettreichem Tag',A,'sonst',B,'Stuhlgänge','Fettreich, Schmorgericht, Frittiert oder Brioche');
  }
  // Bier -> Folgetag
  {
    const vals = tr.map(d=>d.beer); const m = median(vals);
    if(m!=null && Math.max(...vals)>Math.min(...vals)){
      const thr = m; const A=[], B=[];
      tr.forEach(d=>{ const nx = getS(addDays(d.k,1)); if(!nx.tracked) return; (d.beer>thr?A:B).push(nx.stool); });
      cmp('Bier am Abend → Stuhlgänge am Folgetag',`mehr als ${num(thr)} × 500 ml`,A,`${num(thr)} oder weniger`,B,'Stuhlgänge');
    }
  }
  // Zigaretten -> gleicher Tag
  {
    const vals = tr.map(d=>d.cigs); const m = median(vals);
    if(m!=null && Math.max(...vals)>Math.min(...vals)){
      const A=tr.filter(d=>d.cigs>m).map(d=>d.stool), B=tr.filter(d=>d.cigs<=m).map(d=>d.stool);
      cmp('Zigaretten → Stuhlgänge am selben Tag',`mehr als ${num(m,0)} Zigaretten`,A,`${num(m,0)} oder weniger`,B,'Stuhlgänge');
    }
  }
  // Stress
  {
    const s = tr.filter(d=>d.stress!=null);
    cmp('Stress → Stuhlgänge am selben Tag','Stress 6–10',s.filter(d=>d.stress>=6).map(d=>d.stool),'Stress 1–5',s.filter(d=>d.stress<=5).map(d=>d.stool),'Stuhlgänge');
  }
  // Tagesart
  {
    const work = tr.filter(d=>d.dtype==='Büro'||d.dtype==='Homeoffice').map(d=>d.stool);
    const free = tr.filter(d=>d.dtype==='Frei'||d.dtype==='Reise').map(d=>d.stool);
    cmp('Arbeitstag oder frei','Büro / Homeoffice',work,'Frei / Reise',free,'Stuhlgänge');
  }

  // Colestyramin vorher/nachher (über alle Daten)
  const allKeys = [...new Set([...Object.keys(byDay), ...Object.keys(S.days)])].sort();
  const start = allKeys.find(k=>(S.days[k]||{}).chol>0);
  if(start){
    const before=[], after=[];
    for(let i=1;i<=14;i++){ const s=getS(addDays(start,-i)); if(s.tracked) before.push(s); }
    for(let k=start; k<=todayKey(); k=addDays(k,1)){ const s=getS(k); if(s.tracked) after.push(s); }
    const f = arr => { const st=arr.flatMap(d=>d.st); return {n:arr.length, stool:avg(arr.map(d=>d.stool)), loose: st.length? st.filter(e=>e.bristol>=6).length/st.length : null, pain:avg(arr.map(d=>d.pain)), lop:avg(arr.map(d=>d.lop))}; };
    R.chol = {start, before:f(before), after:f(after), days: Math.round((keyDate(todayKey())-keyDate(start))/864e5)+1};
  }
  return R;
}

function chartSVG(ds, field, opts){
  const n = ds.length, W = 340, H = opts.h||140, pl = 20, pr = 4, pt = 8, pb = 18;
  const iw = W-pl-pr, ih = H-pt-pb, cw = iw/n, bw = Math.max(2.5, Math.min(18, cw*0.64));
  const vals = ds.map(d=>d[field]);
  const max = Math.max(opts.minMax||4, ...vals);
  const step = max>12 ? Math.ceil(max/4) : (max>6 ? 2 : 1);
  const top = Math.ceil(max/step)*step;
  const y = v => pt + ih - (v/top)*ih;
  let g = '';
  for(let v=0; v<=top; v+=step){ g += `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  let bars = '';
  const every = n<=7 ? 1 : (n<=14 ? 2 : 5);
  ds.forEach((d,i)=>{
    const x = pl + i*cw + (cw-bw)/2;
    if(!d.tracked){ bars += `<rect class="f-none" x="${x}" y="${y(0)-1.5}" width="${bw}" height="1.5"/>`; }
    else if(opts.stack){
      const loose = d.loose - d.liquid, liquid = d.liquid, rest = d.stool - d.loose;
      let base = 0;
      [[rest,'f-ok'],[loose,'f-loose'],[liquid,'f-liquid']].forEach(([v,c])=>{ if(v>0){ bars += `<rect class="${c}" x="${x}" y="${y(base+v)}" width="${bw}" height="${y(base)-y(base+v)}" rx="1.5"/>`; base+=v; } });
    } else if(d[field]>0){
      bars += `<rect class="f-acc" x="${x}" y="${y(d[field])}" width="${bw}" height="${y(0)-y(d[field])}" rx="1.5"/>`;
    }
    if(i%every===0 || i===n-1){ const dd = keyDate(d.k); bars += `<text x="${pl+i*cw+cw/2}" y="${H-5}" text-anchor="middle">${dd.getDate()}.${n<=7?(dd.getMonth()+1)+'.':''}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${g}${bars}</svg>`;
}

function insightHTML(it){
  if(it.single) return `<div class="card insight"><h3>${esc(it.title)}</h3><div class="big">${it.big}</div><p class="note" style="margin:4px 0 0">${esc(it.sub)}</p></div>`;
  const mx = Math.max(it.va, it.vb, 0.1);
  const diff = it.vb>0 ? (it.va-it.vb)/it.vb : null;
  const verdict = Math.abs(it.va-it.vb) < 0.5 ? 'Kaum Unterschied.' : (it.va>it.vb ? `Ø ${num(it.va-it.vb)} ${it.unit} mehr${diff!=null?` (+${Math.round(diff*100)} %)`:''}.` : `Ø ${num(it.vb-it.va)} ${it.unit} weniger.`);
  return `<div class="card insight"><h3>${esc(it.title)}</h3>
    <div class="cmp">
      <span>${esc(it.la)} <span class="muted">(${it.na} Tage)</span></span><b>${num(it.va)}</b>
      <div class="bar"><span style="width:${(it.va/mx*100).toFixed(1)}%"></span></div>
      <span>${esc(it.lb)} <span class="muted">(${it.nb} Tage)</span></span><b>${num(it.vb)}</b>
      <div class="bar b"><span style="width:${(it.vb/mx*100).toFixed(1)}%"></span></div>
    </div>
    <p class="note" style="margin:2px 0 0">${verdict}${it.hint?` ${esc(it.hint)}.`:''}</p></div>`;
}

function viewAuswertung(){
  const R = analyze(range);
  const head = `<div class="top"><h1>Auswertung</h1></div>
  <div class="chips" style="margin-bottom:14px">${[7,14,30,60].map(n=>`<button class="chip" data-range="${n}" aria-pressed="${range===n}">${n} Tage</button>`).join('')}</div>`;
  if(R.tr.length < 2) return head + `<div class="card"><p class="empty">Ab zwei erfassten Tagen erscheinen hier deine Stuhlgänge pro Tag, die Konsistenz und Vergleiche: fettreiches Essen, Bier, Zigaretten, Stress und Colestyramin vorher und nachher. Je mehr Tage, desto aussagekräftiger.</p></div>`;
  let chol = '';
  if(R.chol){
    const c = R.chol;
    chol = `<div class="card insight"><h3>Colestyramin seit ${esc(fmtDate(c.start))} (Tag ${c.days})</h3>
      ${c.before.n ? `<div class="cmp">
        <span>Stuhlgänge pro Tag, vorher <span class="muted">(${c.before.n} Tage)</span></span><b>${num(c.before.stool)}</b>
        <div class="bar b"><span style="width:${(c.before.stool/Math.max(c.before.stool,c.after.stool||0,0.1)*100).toFixed(1)}%"></span></div>
        <span>seit Beginn <span class="muted">(${c.after.n} Tage)</span></span><b>${num(c.after.stool)}</b>
        <div class="bar"><span style="width:${((c.after.stool||0)/Math.max(c.before.stool,c.after.stool||0,0.1)*100).toFixed(1)}%"></span></div>
      </div>
      <p class="note" style="margin:2px 0 0">Anteil Typ 6–7: ${pct(c.before.loose)} → ${pct(c.after.loose)} · Schmerzen pro Tag: ${num(c.before.pain)} → ${num(c.after.pain)} · Loperamid pro Tag: ${num(c.before.lop)} → ${num(c.after.lop)}</p>`
      : `<p class="note">Für den Vergleich fehlen erfasste Tage vor dem Start. Seit Beginn: Ø ${num(c.after.stool)} Stuhlgänge pro Tag, Typ 6–7 bei ${pct(c.after.loose)}.</p>`}
    </div>`;
  }
  return head + `<div class="stack">
    <div class="today-sum">
      <div class="stat"><b>${num(R.avgStool)}</b><span>Ø Stuhlgänge/Tag</span></div>
      <div class="stat"><b>${num(R.avgB)}</b><span>Ø Bristol-Typ</span></div>
      <div class="stat"><b>${pct(R.loosePct)}</b><span>Typ 6–7</span></div>
    </div>
    <div class="card">
      <span class="label">Stuhlgänge pro Tag</span>
      ${chartSVG(R.ds,'stool',{stack:true,label:'Stuhlgänge pro Tag',h:150})}
      <div class="legend"><span><i class="c-ok"></i>Typ 1–5</span><span><i class="c-soft"></i>Typ 6</span><span><i class="c-liquid"></i>Typ 7</span><span><i style="background:var(--line)"></i>nicht erfasst</span></div>
    </div>
    <div class="card">
      <span class="label">Bier pro Tag (je 500 ml)</span>
      ${chartSVG(R.ds,'beer',{label:'Bier pro Tag',h:100,minMax:4})}
    </div>
    ${chol}
    ${R.insights.map(insightHTML).join('')}
    <p class="note">Das sind Muster aus deinen Einträgen, kein Beweis für Ursachen. Vergleiche erscheinen erst, wenn jede Gruppe mindestens zwei Tage hat.</p>
  </div>`;
}

/* ---------- Daten ---------- */
function summaryText(){
  const R = analyze(range);
  if(!R.tr.length) return 'Noch keine Daten im gewählten Zeitraum.';
  const first = R.tr[0].k, last = R.tr[R.tr.length-1].k;
  const L = [];
  L.push('Darmtagebuch – Zusammenfassung');
  L.push(`Zeitraum: ${fmtDate(first)} – ${fmtDate(last)} (${R.tr.length} erfasste Tage)`);
  L.push('');
  L.push(`Stuhlgang: Ø ${num(R.avgStool)} pro Tag (min. ${R.minStool}, max. ${R.maxStool})`);
  L.push(`Konsistenz (Bristol): Ø Typ ${num(R.avgB)}; Typ 6–7 bei ${pct(R.loosePct)} der Stuhlgänge`);
  L.push(`Dringend: ${pct(R.urgentPct)} · fettig/hell: ${pct(R.fattyPct)} · Brennen: ${pct(R.burnPct)}`);
  if(R.afterMealPct!=null) L.push(`Stuhlgang bis 2 h nach einer Mahlzeit: ${pct(R.afterMealPct)}`);
  if(R.painCount) L.push(`Bauchschmerzen: ${R.painCount}× (Ø Stärke ${num(R.painAvg)}/10)${R.painLocs.length?'; Orte: '+R.painLocs.map(([l,c])=>l+' '+c+'×').join(', '):''}${R.painAfterMealPct!=null?`; ${pct(R.painAfterMealPct)} bis 2 h nach dem Essen`:''}`);
  const fat = R.insights.find(i=>i.title.startsWith('Fettreiches'));
  if(fat) L.push(`Nach fettreichen Tagen: Folgetag Ø ${num(fat.va)} Stuhlgänge, sonst Ø ${num(fat.vb)}`);
  L.push('');
  L.push(`Loperamid: Ø ${num(R.avg_lop)} Kapseln/Tag`);
  if(R.chol){ const c=R.chol; L.push(`Colestyramin seit ${fmtDate(c.start)}: Stuhlgänge/Tag ${c.before.n?num(c.before.stool)+' vorher → ':''}${num(c.after.stool)} seit Beginn; Typ 6–7 ${c.before.n?pct(c.before.loose)+' → ':''}${pct(c.after.loose)}`); }
  L.push(`Bier: Ø ${num(R.avg_beer)} × 500 ml/Tag · Zigaretten: Ø ${num(R.avg_cigs,0)}/Tag · Kaffee: Ø ${num(R.avg_coffee)} Tassen/Tag`);
  return L.join('\n');
}
function viewDaten(){
  const n = S.entries.length;
  const lb = S.meta.lastBackup;
  return `<div class="top"><h1>Daten</h1></div>
  <div class="stack">
    <div class="card">
      <span class="label">Für den Arzttermin</span>
      <div class="chips" style="margin-bottom:10px">${[7,14,30,60].map(k=>`<button class="chip" data-range="${k}" aria-pressed="${range===k}">${k} Tage</button>`).join('')}</div>
      <pre class="summary" id="summary">${esc(summaryText())}</pre>
      <div class="btns" style="margin-top:10px"><button class="btn primary" data-act="copy-summary">Zusammenfassung kopieren</button></div>
      <p class="note" style="margin:8px 0 0">In eine Notiz oder Nachricht einfügen und zum Termin mitnehmen.</p>
    </div>

    <div class="card">
      <span class="label">Sicherung</span>
      <p style="margin:0 0 10px">${n} Einträge, ${Object.keys(S.days).length} Tage mit Zählwerten. ${lb?`Letzte Sicherung: ${esc(new Date(lb).toLocaleDateString('de-DE'))}.`:'Noch keine Sicherung.'}</p>
      <div class="btns"><button class="btn primary" data-act="export">Sicherung kopieren</button></div>
      <p class="note" style="margin:8px 0 12px">Kopiert alle Daten als Text. Füg ihn in eine Notiz-App oder schick ihn dir per Mail. Eine zusätzliche Kopie für den Notfall.</p>
      <textarea id="exportbox" readonly hidden aria-label="Sicherungstext"></textarea>
      <div class="field" style="margin-top:6px">
        <label class="label" for="importbox">Sicherung wiederherstellen</label>
        <textarea id="importbox" placeholder="Sicherungstext hier einfügen"></textarea>
        <div class="btns"><button class="btn" data-act="import">Einfügen und zusammenführen</button></div>
        <p class="note" style="margin:0">Vorhandene Einträge bleiben erhalten, gleiche Einträge werden nicht doppelt angelegt.</p>
      </div>
    </div>

    <div class="card">
      <span class="label">Speicherort</span>
      <p style="margin:0 0 10px" id="syncstate">${SYNC_TEXT[syncState]}</p>
      <ol class="steps">
        <li>Immer über das Icon auf dem Home-Bildschirm öffnen. Das Icon hat einen eigenen Speicher, getrennt von Safari.</li>
        <li>Einträge von einem anderen Gerät übernimmst du über „Sicherung wiederherstellen“.</li>
      </ol>
    </div>

    <div class="card">
      <span class="label">Alles löschen</span>
      <p class="note" style="margin:0 0 10px">Entfernt alle Einträge aus diesem Browser. Mach vorher eine Sicherung.</p>
      <div class="btns"><button class="btn danger" data-act="wipe">Alle Daten löschen</button></div>
    </div>
  </div>`;
}

async function copyText(txt, fallbackEl){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    if(fallbackEl){ fallbackEl.value = txt; fallbackEl.hidden = false; fallbackEl.focus(); fallbackEl.select(); }
    return false;
  }
}
function doImport(){
  const box = $('#importbox'); const raw = (box.value||'').trim();
  if(!raw){ toast('Zuerst einen Sicherungstext einfügen.'); return; }
  let d;
  try{ d = JSON.parse(raw); }catch(e){ toast('Das ist kein gültiger Sicherungstext.'); return; }
  if(!d || !Array.isArray(d.entries)){ toast('Im Text fehlen die Einträge.'); return; }
  const ids = new Set(S.entries.map(e=>e.id)); let added = 0;
  d.entries.forEach(e=>{ if(e && e.id && typeof e.t==='number' && !ids.has(e.id)){ S.entries.push(e); ids.add(e.id); added++; } });
  Object.entries(d.days||{}).forEach(([k,v])=>{ S.days[k] = Object.assign({}, S.days[k]||{}, v); });
  save(); box.value=''; render(); toast(`${added} Einträge wiederhergestellt`);
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t=$('.toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2200); }

/* ---------- Ereignisse ---------- */
let wipeArmed = null, delArmed = null;
document.addEventListener('click', async ev=>{
  const b = ev.target.closest('button'); if(!b) return;
  const ds = b.dataset;

  if(ds.tab){ tab = ds.tab; if(tab==='heute') {} render(); window.scrollTo(0,0); return; }
  if(ds.go){ tab = ds.go; render(); window.scrollTo(0,0); return; }
  if(ds.new){ openSheet(ds.new); return; }
  if(ds.edit){ openSheet(null, ds.edit); return; }
  if(ds.day){ cur = ds.day; tab='heute'; render(); window.scrollTo(0,0); return; }
  if(ds.range){ range = +ds.range; render(); return; }

  if(ds.cnt){
    const d = S.days[cur] = S.days[cur] || {};
    d[ds.cnt] = Math.max(0, (d[ds.cnt]||0) + (+ds.d));
    save(); render(); return;
  }
  if(ds.addmed){ S.meta.show = S.meta.show || {}; S.meta.show[ds.addmed] = true; save(); render(); return; }
  if(ds.stress){ const d = S.days[cur] = S.days[cur]||{}; const v=+ds.stress; d.stress = d.stress===v ? null : v; save(); render(); return; }
  if(ds.dtype){ const d = S.days[cur] = S.days[cur]||{}; d.dtype = d.dtype===ds.dtype ? null : ds.dtype; save(); render(); return; }

  // Sheet-Steuerung
  if(draft && b.closest('.sheet')){
    if(ds.pick){
      const v = +ds.val; draft[ds.pick] = draft[ds.pick]===v ? null : v;
      b.parentElement.querySelectorAll('[data-pick]').forEach(x=>x.setAttribute('aria-pressed', String(+x.dataset.val===draft[ds.pick])));
      return;
    }
    if(ds.flag){ draft[ds.flag] = !draft[ds.flag]; b.setAttribute('aria-pressed', String(draft[ds.flag])); return; }
    if(ds.multi){
      const arr = draft[ds.multi] = draft[ds.multi] || [];
      const i = arr.indexOf(ds.val); if(i>=0) arr.splice(i,1); else arr.push(ds.val);
      b.setAttribute('aria-pressed', String(i<0)); return;
    }
  }

  switch(ds.act){
    case 'prev': cur = addDays(cur,-1); render(); break;
    case 'next': if(cur<todayKey()){ cur = addDays(cur,1); render(); } break;
    case 'close': closeSheet(); render(); break;
    case 'resume-draft': { const st = getStash(); if(st){ cur = dayKey(st.t||Date.now()); render(); openSheet(st.type, st.id, st); } break; }
    case 'discard-draft': clearStash(); render(); break;
    case 'save-entry': saveEntry(); break;
    case 'del-entry':
      if(delArmed===draft.id){ S.entries = S.entries.filter(x=>x.id!==draft.id); delArmed=null; save(); closeSheet(); render(); toast('Eintrag gelöscht'); }
      else { delArmed = draft.id; b.classList.add('armed'); b.textContent='Wirklich löschen?'; setTimeout(()=>{ if(delArmed){ delArmed=null; if(b.isConnected){ b.classList.remove('armed'); b.textContent='Löschen'; } } },4000); }
      break;
    case 'hint-done': S.meta.hintDone = true; save(); render(); break;
    case 'copy-summary': { const ok = await copyText(summaryText(), null); if(ok) toast('Zusammenfassung kopiert'); else { const pre=$('#summary'); const r=document.createRange(); r.selectNodeContents(pre); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Text markiert – jetzt kopieren'); } break; }
    case 'export': {
      const txt = JSON.stringify({app:'Darmtagebuch', exported:new Date().toISOString(), v:1, entries:S.entries, days:S.days});
      const ok = await copyText(txt, $('#exportbox'));
      S.meta.lastBackup = Date.now(); save();
      if(ok){ toast('Sicherung kopiert – jetzt in eine Notiz einfügen'); render(); }
      else toast('Text markiert – jetzt kopieren');
      break;
    }
    case 'import': doImport(); break;
    case 'wipe':
      if(wipeArmed){ S = {v:1, entries:[], days:{}, meta:{hintDone:true}}; wipeArmed=null; save(); cur=todayKey(); render(); toast('Alle Daten gelöscht'); }
      else { wipeArmed = true; b.classList.add('armed'); b.textContent='Wirklich alles löschen?'; setTimeout(()=>{ wipeArmed=null; if(b.isConnected){ b.classList.remove('armed'); b.textContent='Alle Daten löschen'; } },4000); }
      break;
  }
});
document.addEventListener('click', ()=>{ if(draft) stashDraft(); });
['input','change','blur'].forEach(t=>document.addEventListener(t, ev=>{ if(draft && ev.target.closest && ev.target.closest('.sheet')) stashDraft(); }, true));
let noteT;
document.addEventListener('input', ev=>{
  if(ev.target.id==='daynote'){
    const d = S.days[cur] = S.days[cur]||{}; d.note = ev.target.value;
    clearTimeout(noteT); noteT = setTimeout(save, 400);
  }
});
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && draft) closeSheet(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ const t=todayKey(); if(cur>t) cur=t; if(!draft) render(); } });

load();
syncState='device';
render();
})();
</script>
